<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公告管理｜RICOH Smart Hub</title><style>body{margin:0;background:#f4f8fc;font-family:"Noto Sans TC",Arial,sans-serif;color:#173456}.nav{padding:17px 5%;background:#08295d;color:#fff;display:flex;justify-content:space-between}.nav a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:1000px;margin:auto;padding:28px 20px}.panel{background:#fff;border:1px solid #dbe8f5;border-radius:13px;padding:18px;margin-bottom:14px}.login{max-width:430px;margin:40px auto}label{display:block;font-size:10px;font-weight:900;color:#52708d;margin-top:9px}input,textarea,select{width:100%;box-sizing:border-box;margin-top:4px;padding:10px;border:1px solid #cbdceb;border-radius:8px;font-family:inherit}textarea{min-height:110px}.btn{border:0;border-radius:8px;padding:10px 15px;background:#0878e8;color:#fff;font-weight:800;cursor:pointer}.red{background:#fff0f0;color:#a32626;border:1px solid #f0caca}.actions{display:flex;gap:8px;margin-top:12px}.hidden{display:none}.row{padding:12px 0;border-bottom:1px solid #e6eef6;font-size:12px}</style></head><body><header class="nav"><a href="index.html">RICOH Smart Hub</a><a href="announcements.html">← 公告</a></header><main class="wrap"><h1>系統公告管理</h1><section id="login" class="panel login"><b>管理員登入</b><label>帳號</label><input id="email" value="admin"><label>密碼</label><input id="pw" type="password"><div class="actions"><button class="btn" id="loginBtn">登入</button></div><div id="lm"></div></section><section id="admin" class="hidden"><div class="panel"><h3>新增公告</h3><label>標題 *</label><input id="title"><label>等級</label><select id="level"><option>一般</option><option>重要</option><option>維護</option></select><label>內容 *</label><textarea id="content"></textarea><label>公開</label><select id="published"><option value="true">是</option><option value="false">否</option></select><div class="actions"><button class="btn" id="save">發布</button></div><div id="msg"></div></div><div class="panel"><h3>公告列表</h3><div id="list"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ppzdwearxmxrkqgcphvt.supabase.co','sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb'),ADMIN='willie.lee@ricoh.com.tw',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const $=id=>document.getElementById(id);$('loginBtn').onclick=async()=>{let e=$('email').value.trim();if(e==='admin')e=ADMIN;const r=await db.auth.signInWithPassword({email:e,password:$('pw').value});if(r.error){$('lm').textContent='登入失敗：'+r.error.message;return}init()};async function init(){const u=(await db.auth.getUser()).data.user;if(!u||u.email!==ADMIN)return;$('login').classList.add('hidden');$('admin').classList.remove('hidden');load()}async function load(){const r=await db.from('announcements').select('*').order('created_at',{ascending:false});$('list').innerHTML=(r.data||[]).map(x=>'<div class="row"><b>'+esc(x.title)+'</b>｜'+esc(x.level)+'｜公開 '+x.published+'<br><button class="btn red" onclick="del('+x.id+')">刪除</button></div>').join('')||'沒有公告'}window.del=async id=>{if(confirm('確定刪除？')){await db.from('announcements').delete().eq('id',id);load()}};$('save').onclick=async()=>{const row={title:$('title').value.trim(),content:$('content').value.trim(),level:$('level').value,published:$('published').value==='true'};if(!row.title||!row.content){$('msg').textContent='標題與內容必填';return}const r=await db.from('announcements').insert(row);$('msg').textContent=r.error?'失敗：'+r.error.message:'發布完成';if(!r.error){$('title').value='';$('content').value='';load()}};</script></body></html>
