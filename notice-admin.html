<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全站公告管理｜RICOH Smart Hub</title><style>body{margin:0;background:#f4f8fc;color:#173456;font-family:"Noto Sans TC",Arial,sans-serif}.nav{padding:17px 5%;background:#08295d;color:#fff;display:flex;justify-content:space-between}.nav a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:900px;margin:auto;padding:30px 20px}.panel{background:#fff;border:1px solid #dbe8f5;border-radius:14px;padding:20px;margin-bottom:15px}.login{max-width:420px;margin:50px auto}label{display:block;font-size:11px;font-weight:900;color:#52708d;margin:12px 0 4px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbdceb;border-radius:9px;font-family:inherit}textarea{min-height:130px}.btn{border:0;border-radius:9px;padding:11px 18px;background:#0878e8;color:#fff;font-weight:900;cursor:pointer}.red{background:#fff0f2;color:#b00025;border:1px solid #f0c5cd}.actions{display:flex;gap:8px;margin-top:13px}.hidden{display:none}.preview{margin-top:16px;background:#fff7e6;border:1px solid #f0d39a;color:#744b00;padding:12px;border-radius:8px;font-size:12px;overflow:hidden;white-space:nowrap}.history{font-size:12px}.row{padding:12px 0;border-bottom:1px solid #e6eef6}.row small{color:#60758f}@media(max-width:600px){.actions{flex-direction:column}.btn{width:100%}}</style></head><body><header class="nav"><a href="index.html">RICOH Smart Hub</a><a href="announcements.html">← 公告</a></header><main class="wrap"><h1>全站最上方公告管理</h1><section id="login" class="panel login"><b>管理員登入</b><label>帳號</label><input id="email" value="admin"><label>密碼</label><input id="pw" type="password"><div class="actions"><button class="btn" id="lb">登入</button></div><div id="lm"></div></section><section id="admin" class="hidden"><div class="panel"><h2>📢 編輯全站跑馬公告</h2><div style="font-size:12px;color:#60758f">這裡只管理網站最上方那一條公告，不會影響一般公告頁。</div><label>公告文字</label><textarea id="message" placeholder="例如：本週新增 IM C3000 SC Code 資料，請大家使用看看，有問題直接回報。"></textarea><label>顯示</label><select id="enabled" style="width:100%;padding:11px;border:1px solid #cbdceb;border-radius:9px"><option value="true">顯示</option><option value="false">隱藏</option></select><div class="preview">📢 <span id="pv">預覽公告內容</span></div><div class="actions"><button class="btn" id="save">立即更新全站公告</button><button class="btn red" id="hide">立即隱藏公告</button></div><div id="msg" style="margin-top:10px;font-size:12px"></div></div><div class="panel history"><h3>最近更新</h3><div id="history">載入中…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ppzdwearxmxrkqgcphvt.supabase.co','sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb'),ADMIN='willie.lee@ricoh.com.tw',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));$('message').oninput=()=>{$('pv').textContent=$('message').value||'預覽公告內容'};$('lb').onclick=async()=>{let e=$('email').value.trim();if(e==='admin')e=ADMIN;const r=await db.auth.signInWithPassword({email:e,password:$('pw').value});if(r.error){$('lm').textContent='登入失敗：'+r.error.message;return}init()};async function init(){const u=(await db.auth.getUser()).data.user;if(!u||u.email!==ADMIN){$('lm').textContent='沒有管理權限';return}$('login').classList.add('hidden');$('admin').classList.remove('hidden');load()}async function load(){const r=await db.from('site_notice').select('*').order('updated_at',{ascending:false}).limit(10);const x=r.data?.[0];if(x){$('message').value=x.message||'';$('enabled').value=String(x.enabled);$('pv').textContent=x.message||'預覽公告內容'}$('history').innerHTML=(r.data||[]).map(x=>'<div class="row"><b>'+esc(x.message)+'</b><br><small>'+new Date(x.updated_at).toLocaleString('zh-TW')+'｜'+(x.enabled?'顯示':'隱藏')+'</small></div>').join('')||'尚無紀錄'}async function update(enabled){const r=await db.from('site_notice').update({message:$('message').value.trim(),enabled,updated_at:new Date().toISOString()}).not('id','is',null);$('msg').textContent=r.error?'更新失敗：'+r.error.message:(enabled?'已更新，全站現在就會顯示新公告。':'已隱藏全站公告。');load()}$('save').onclick=()=>update(true);$('hide').onclick=()=>update(false);init()</script></body></html>
