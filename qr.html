<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QR Code 管理｜Ricoh Smart Service Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--red:#cc0000;--off:#f7f7f7;--line:#ddd;--text:#222;--sub:#666}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC",sans-serif;color:var(--text)}.nav{height:58px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5%}.brand{font-size:20px;font-weight:900}.brand span{font-size:12px;font-weight:400;margin-left:10px}.nav a{color:#fff;text-decoration:none;font-size:13px}.wrap{max-width:1200px;margin:auto;padding:40px 24px 70px}.title{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.title h1{font-size:40px;margin:0;font-weight:900}.owner{border-left:4px solid var(--red);padding-left:18px;color:var(--red);font-size:18px;font-weight:900;line-height:1.45}.desc{color:var(--sub);margin:12px 0 28px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.card{border:1px solid var(--line);border-radius:10px;padding:24px;background:#fff}.card h2{font-size:19px;margin:0 0 18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700}.field input{border:1px solid #ccc;border-radius:6px;padding:10px 12px;font:inherit}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:10px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.preview{text-align:center}.qr{width:260px;height:260px;margin:10px auto 16px;display:flex;align-items:center;justify-content:center}.qr img,.qr canvas{max-width:260px}.mail{background:var(--off);padding:13px;text-align:left;font-size:12px;white-space:pre-wrap;line-height:1.65}.batch{margin-top:18px}.batch-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.file{border:1px dashed #bbb;padding:12px;border-radius:7px;flex:1}.table-wrap{overflow:auto;margin-top:15px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px;border-bottom:1px solid #e0e0e0;text-align:left;white-space:nowrap}.table th{background:#f7f7f7}.empty{text-align:center;padding:30px;color:#999}#printArea{display:none}@media(max-width:850px){.grid,.form{grid-template-columns:1fr}.title h1{font-size:32px}}@media print{@page{size:A4 portrait;margin:5mm}body.printing>*:not(#printArea){display:none!important}body.printing #printArea{display:block!important}.print-page{width:200mm;height:287mm;display:grid;grid-template-columns:repeat(5,40mm);grid-template-rows:repeat(5,50mm);page-break-after:always;break-after:page}.print-page:last-child{page-break-after:auto;break-after:auto}.print-label{width:40mm;height:50mm;border:.3mm solid #999;padding:1mm 0;text-align:center;display:flex;flex-direction:column;align-items:center;overflow:hidden}.print-label .company{height:6mm;width:100%;font-size:10pt;font-weight:900;display:flex;align-items:center;justify-content:center;overflow:hidden}.print-label .qr{width:35mm;height:35mm;margin:0}.print-label .qr img,.print-label .qr canvas{width:35mm!important;height:35mm!important}.print-label .machine{font-size:9pt;font-weight:900;line-height:1.15;margin-top:.5mm;word-break:break-all}}
</style></head>
<body>
<nav class="nav"><div class="brand">RICOH <span>Smart Service Hub</span></div><a href="index.html">返回首頁</a></nav>
<main class="wrap">
<div class="title"><h1>QR Code 管理</h1><div class="owner">TY0032-Willie 製作<br>有問題請聯絡 TY0032</div></div>
<div class="desc">依公司既有 QR Code 報修格式建立標籤。QR Code 直接編碼報修 Email，掃描後開啟手機 Email App。</div>
<div class="grid">
<section class="card"><h2>① 單筆建立 QR Code</h2><div class="form">
<div class="field"><label>客戶名稱</label><input id="company" value="台灣理光"></div>
<div class="field"><label>機號</label><input id="machine" value="A123567890"></div>
<div class="field full"><label>客服信箱</label><input id="email" value="rt@ricoh.com.tw"></div>
<div class="field full"><label>裝機地址</label><input id="address" value=""></div>
<div class="field"><label>聯絡人</label><input id="contact" value=""></div>
<div class="field"><label>聯絡方式</label><input id="phone" value=""></div>
</div><div class="actions"><button class="btn red" onclick="generate()">產生 QR Code</button><button class="btn" onclick="clearForm()">清除重填</button></div></section>
<section class="card preview"><h2>QR Code 預覽</h2><div class="qr" id="qr"></div><div class="mail" id="mail">請先產生 QR Code</div><div class="actions" style="justify-content:center"><button class="btn red" onclick="printOne()">列印標籤</button></div></section>
</div>
<section class="card batch"><h2>② CSV 批次匯入</h2><div class="batch-top"><input class="file" type="file" id="csv" accept=".csv"><button class="btn" onclick="downloadTemplate()">下載 CSV 範本</button><button class="btn red" onclick="importCSV()">匯入並產生</button></div><div class="table-wrap"><table class="table"><thead><tr><th>客戶名稱</th><th>機號</th><th>裝機地址</th><th>聯絡人</th><th>聯絡方式</th><th>客服信箱</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">尚未匯入資料</td></tr></tbody></table></div><div class="actions"><button class="btn" onclick="printBatch()">批次列印（每頁 25 張）</button><button class="btn" onclick="batch=[];render()">清除批次資料</button></div></section>
</main><div id="printArea"></div>
<script>
let current=null,batch=[];
function val(id){return document.getElementById(id).value.trim()}
function data(){return{company:val('company'),machine:val('machine'),email:val('email')||'rt@ricoh.com.tw',address:val('address'),contact:val('contact'),phone:val('phone')}}
function mailto(d){let subject='QR code 報修 機號 '+d.machine;let body=['客戶名稱：'+d.company,'裝機地址：'+d.address,'聯絡人：'+d.contact,'聯絡方式：'+d.phone,'聯絡事項：'].join('\r\n');return'mailto:'+d.email+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}
function mailtoPreview(d){return'收件人：'+d.email+'\n標題：QR code 報修 機號 '+d.machine+'\n\n客戶名稱：'+d.company+'\n裝機地址：'+d.address+'\n聯絡人：'+d.contact+'\n聯絡方式：'+d.phone+'\n聯絡事項：'}
function draw(el,d,size){el.innerHTML='';return new QRCode(el,{text:mailto(d),width:size,height:size,colorDark:'#b00000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M})}
function generate(){current=data();draw(document.getElementById('qr'),current,260);document.getElementById('mail').textContent=mailtoPreview(current)}
function clearForm(){document.getElementById('address').value='';document.getElementById('contact').value='';document.getElementById('phone').value='';generate()}
function printOne(){if(!current)generate();let a=document.getElementById('printArea');a.innerHTML='<div class="print-page"><div class="print-label"><div class="company">'+esc(current.company)+'</div><div id="printQR" class="qr"></div><div class="machine">'+esc(current.machine)+'</div></div></div>';draw(document.getElementById('printQR'),current,700);document.body.classList.add('printing');setTimeout(()=>{window.print();document.body.classList.remove('printing')},300)}
function parseCSV(t){let lines=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];let h=lines[0].split(',').map(x=>x.trim().replace(/^"|"$/g,''));return lines.slice(1).map(line=>{let a=line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));let o={};h.forEach((k,i)=>o[k]=a[i]||'');return{company:o['客戶名稱']||o['公司']||'',machine:o['機器號碼']||o['機號']||'',address:o['裝機地址']||o['客戶地址']||o['地址']||'',contact:o['聯絡人']||'',phone:o['聯絡方式']||o['電話']||'',email:o['客服信箱']||'rt@ricoh.com.tw'}})}
function importCSV(){let f=document.getElementById('csv').files[0];if(!f)return alert('請先選擇 CSV 檔案');let r=new FileReader();r.onload=e=>{let bytes=new Uint8Array(e.target.result);let u=new TextDecoder('utf-8').decode(bytes);let t=u.includes('\ufffd')?new TextDecoder('big5').decode(bytes):u;batch=parseCSV(t).filter(x=>x.machine);if(!batch.length)return alert('CSV 已讀取，但沒有找到有效的機號資料，請確認欄位名稱與內容。');render()};r.readAsArrayBuffer(f)}
function render(){let tb=document.getElementById('rows');if(!batch.length){tb.innerHTML='<tr><td colspan="7" class="empty">尚未匯入資料</td></tr>';return}tb.innerHTML=batch.map((d,i)=>'<tr><td>'+esc(d.company)+'</td><td>'+esc(d.machine)+'</td><td>'+esc(d.address)+'</td><td>'+esc(d.contact)+'</td><td>'+esc(d.phone)+'</td><td>'+esc(d.email)+'</td><td><button class="btn" onclick="loadRow('+i+')">載入</button> <button class="btn" onclick="batch.splice('+i+',1);render()">刪除</button></td></tr>').join('')}
function loadRow(i){let d=batch[i];['company','machine','email','address','contact','phone'].forEach(k=>document.getElementById(k).value=d[k]);generate();scrollTo({top:0,behavior:'smooth'})}
function printBatch(){if(!batch.length)return alert('請先匯入 CSV 資料');let pages=[];for(let i=0;i<batch.length;i+=25){let chunk=batch.slice(i,i+25);pages.push('<div class="print-page">'+chunk.map((d,j)=>'<div class="print-label"><div class="company">'+esc(d.company)+'</div><div id="bqr'+i+'_'+j+'" class="qr"></div><div class="machine">'+esc(d.machine)+'</div></div>').join('')+'</div>')}document.getElementById('printArea').innerHTML=pages.join('');batch.forEach((d,i)=>{let page=Math.floor(i/25),j=i%25;draw(document.getElementById('bqr'+(page*25)+'_'+j),d,700)});document.body.classList.add('printing');setTimeout(()=>{window.print();document.body.classList.remove('printing')},500)}
function downloadTemplate(){let s='客戶名稱,機號,裝機地址,聯絡人,聯絡方式,客服信箱\n台灣理光,A123567890,,,,rt@ricoh.com.tw';let b=new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='RICOH_QR_CSV範本.csv';a.click()}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
generate();
</script></body></html>
