<!doctype html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code 管理｜Ricoh Smart Service Hub</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>:root{--r:#c00}*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans TC',sans-serif;color:#222}.nav{height:58px;background:var(--r);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5%}.nav a{color:#fff;text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:35px 24px}.title{display:flex;gap:22px;align-items:center;flex-wrap:wrap}.title h1{font-size:38px;margin:0}.owner{border-left:4px solid var(--r);padding-left:15px;color:var(--r);font-weight:900}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.card{border:1px solid #ddd;border-radius:10px;padding:22px;margin-top:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}input{padding:10px;border:1px solid #ccc;border-radius:6px;font:inherit}.btn{padding:10px 15px;border:1px solid #ccc;border-radius:6px;background:#fff;font-weight:700;cursor:pointer}.red{background:var(--r);border-color:var(--r);color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.preview{text-align:center}.qrbig{width:260px;height:260px;margin:10px auto}.mail{white-space:pre-wrap;text-align:left;background:#f7f7f7;padding:12px;font-size:12px}.label{width:40mm;height:50mm;border:1px solid #999;margin:18px auto;padding:2mm;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden}.label .company{font-weight:900;font-size:11pt;height:7mm;display:flex;align-items:center}.label .q35{width:35mm;height:35mm;margin:0 auto}.label .q35 img{width:35mm!important;height:35mm!important}.label .machine{font-weight:900;font-size:9pt;margin-top:1mm;line-height:1}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:7px;border-bottom:1px solid #ddd}.empty{text-align:center;padding:25px;color:#888}#printArea{display:none}@media(max-width:850px){.grid,.form{grid-template-columns:1fr}.full{grid-column:auto}}@media print{@page{size:A4 portrait;margin:8mm}body.printing>*:not(#printArea){display:none!important}body.printing #printArea{display:block!important}.print-page{width:194mm;height:281mm;display:grid;grid-template-columns:repeat(4,40mm);grid-template-rows:repeat(5,50mm);gap:5mm 7mm;justify-content:center;align-content:start}.print-page:last-child{page-break-after:auto}.print-label{width:40mm;height:50mm;border:.3mm solid #999;padding:2mm;display:flex;flex-direction:column;align-items:center;overflow:hidden}.print-label .company{font-size:10pt;font-weight:900;height:6mm;line-height:1;display:flex;align-items:center;max-width:36mm;overflow:hidden;white-space:nowrap}.print-label .qr35{width:35mm;height:35mm;margin:0}.print-label .qr35 img{width:35mm!important;height:35mm!important}.print-label .machine{font-size:8pt;font-weight:900;line-height:1;margin-top:1mm;max-width:36mm;overflow:hidden;white-space:nowrap}.print-label .model{font-size:6.5pt;margin-top:1mm;max-width:36mm;overflow:hidden;white-space:nowrap}}</style></head><body><nav class="nav"><b>RICOH Smart Service Hub</b><a href="index.html">返回首頁</a></nav><main class="wrap"><div class="title"><h1>QR Code 管理</h1><div class="owner">TY0032-Willie 製作<br>有問題請聯絡 TY0032</div></div><p>單筆建立或 CSV 批次匯入。標籤實體尺寸 40 × 50 mm；QR Code 實體尺寸 35 × 35 mm；A4 每頁最多 20 張。</p><div class="grid"><section class="card"><h2>① 單筆建立 QR Code</h2><div class="form"><div class="field"><label>客戶名稱</label><input id="company" value="台灣理光"></div><div class="field"><label>機型</label><input id="model" value="IMC6010"></div><div class="field"><label>機號</label><input id="machine" value="A123567890"></div><div class="field"><label>客服信箱</label><input id="email" value="rt@ricoh.com.tw"></div><div class="field full"><label>客戶地址</label><input id="address"></div><div class="field"><label>聯絡人</label><input id="contact"></div><div class="field"><label>聯絡方式</label><input id="phone"></div></div><div class="actions"><button class="btn red" onclick="generate()">產生 QR Code</button><button class="btn" onclick="clearForm()">清除重填</button></div></section><section class="card preview"><h2>QR Code 預覽</h2><div id="qr" class="qrbig"></div><div id="mail" class="mail">請先產生 QR Code</div><div class="label"><div class="company" id="pc">台灣理光</div><div id="lqr" class="q35"></div><div class="machine" id="pm">A123567890</div></div><div class="actions" style="justify-content:center"><button class="btn red" onclick="downloadQR()">下載 PNG</button><button class="btn" onclick="printOne()">列印標籤</button></div></section></div><section class="card"><h2>② CSV 批次匯入</h2><input type="file" id="csv" accept=".csv"><button class="btn red" onclick="importCSV()">匯入並產生</button><button class="btn" onclick="downloadTemplate()">下載 CSV 範本</button><table class="table"><thead><tr><th>客戶名稱</th><th>機型</th><th>機號</th><th>客戶地址</th><th>聯絡人</th><th>聯絡方式</th><th>客服信箱</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">尚未匯入資料</td></tr></tbody></table><div class="actions"><button class="btn" onclick="printBatch()">批次列印（每頁最多20張）</button><button class="btn" onclick="batch=[];render()">清除批次資料</button></div></section></main><div id="printArea"></div><script>let current,batch=[];const v=id=>document.getElementById(id).value.trim();function d(){return{company:v('company'),model:v('model'),machine:v('machine'),email:v('email')||'rt@ricoh.com.tw',address:v('address'),contact:v('contact'),phone:v('phone')}}function mt(x){let s='RICOH QR Code 報修｜機號 '+x.machine,b=['【RICOH QR Code 報修】','================================','客戶名稱：'+x.company,'機型：'+x.model,'機號：'+x.machine,'客戶地址：'+x.address,'聯絡人：'+x.contact,'聯絡方式：'+x.phone,'','【報修事項】','請填寫故障狀況：','','================================','本信件由 RICOH QR Code 報修標籤產生'].join('\n');return'mailto:'+x.email+'?subject='+encodeURIComponent(s)+'&body='+encodeURIComponent(b)}function draw(el,x,w,h){el.innerHTML='';new QRCode(el,{text:mt(x),width:w,height:h,colorDark:'#b00000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M})}function generate(){current=d();draw(qr,current,260,260);draw(lqr,current,132,132);pc.textContent=current.company;pm.textContent=current.machine;mail.textContent='收件人：'+current.email+'\n主旨：RICOH QR Code 報修｜機號 '+current.machine+'\n\n【報修事項】\n請填寫故障狀況：'}function clearForm(){['address','contact','phone'].forEach(x=>document.getElementById(x).value='');generate()}function downloadQR(){if(!current)generate();let c=qr.querySelector('canvas'),a=document.createElement('a');a.href=c.toDataURL();a.download='RICOH_QR_'+current.machine+'.png';a.click()}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function parseCSV(t){let l=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean),h=l.shift().split(',').map(x=>x.trim().replace(/^"|"$/g,''));return l.map(z=>{let a=z.split(','),o={};h.forEach((k,i)=>o[k]=(a[i]||'').trim().replace(/^"|"$/g,''));return{company:o['客戶名稱']||o['公司']||'',model:o['機型']||'',machine:o['機號']||o['機器號碼']||'',address:o['客戶地址']||o['地址']||'',contact:o['聯絡人']||'',phone:o['聯絡方式']||o['電話']||'',email:o['客服信箱']||'rt@ricoh.com.tw'}})}function importCSV(){let f=csv.files[0];if(!f)return alert('請先選擇 CSV 檔案');let r=new FileReader();r.onload=e=>{batch=parseCSV(e.target.result).filter(x=>x.machine);render()};r.readAsText(f,'UTF-8')}function render(){rows.innerHTML=batch.length?batch.map(x=>'<tr><td>'+esc(x.company)+'</td><td>'+esc(x.model)+'</td><td>'+esc(x.machine)+'</td><td>'+esc(x.address)+'</td><td>'+esc(x.contact)+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.email)+'</td></tr>').join(''):'<tr><td colspan="7" class="empty">尚未匯入資料</td></tr>'}function label(x,i){return'<div class="print-label"><div class="company">'+esc(x.company)+'</div><div id="b'+i+'" class="qr35"></div><div class="machine">'+esc(x.machine)+'</div><div class="model">'+esc(x.model)+'</div></div>'}function printOne(){if(!current)generate();printArea.innerHTML='<div class="print-page">'+label(current,0)+'</div>';draw(document.getElementById('b0'),current,132,132);go()}function printBatch(){if(!batch.length)return alert('請先匯入 CSV 資料');let s='';for(let p=0;p<batch.length;p+=20){s+='<div class="print-page">';for(let j=p;j<Math.min(p+20,batch.length);j++)s+=label(batch[j],j);s+='</div>'}printArea.innerHTML=s;batch.forEach((x,i)=>draw(document.getElementById('b'+i),x,132,132));go()}function go(){document.body.classList.add('printing');setTimeout(()=>{print();document.body.classList.remove('printing')},500)}function downloadTemplate(){let b=new Blob(['\ufeff客戶名稱,機型,機號,客戶地址,聯絡人,聯絡方式,客服信箱\n台灣理光,IMC6010,A123567890,,,,rt@ricoh.com.tw'],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='RICOH_QR_CSV範本.csv';a.click()}generate();</script></body></html>
