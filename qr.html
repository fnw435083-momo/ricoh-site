<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QR Code 管理｜Ricoh Smart Service Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--red:#cc0000;--dark:#a30000;--pale:#fff0f0;--off:#f7f7f7;--line:#e0e0e0;--text:#222;--sub:#666}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC",sans-serif;color:var(--text);background:#fff}
.nav{height:58px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5%}.brand{font-size:20px;font-weight:900}.brand span{font-size:12px;font-weight:400;margin-left:10px}.nav a{color:#fff;text-decoration:none;font-size:13px}
.wrap{max-width:1200px;margin:auto;padding:42px 24px 70px}.title{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.title h1{font-size:40px;margin:0;font-weight:900}.owner{border-left:4px solid var(--red);padding-left:18px;color:var(--red);font-size:20px;font-weight:900;line-height:1.45}.desc{color:var(--sub);font-size:15px;margin:12px 0 30px}
.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:24px}.card h2{font-size:19px;margin:0 0 18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700}.field input{border:1px solid #d5d5d5;border-radius:6px;padding:10px 12px;font:inherit;font-size:14px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:10px 16px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.preview{text-align:center}.qr{width:260px;height:260px;margin:10px auto 16px;display:flex;align-items:center;justify-content:center}.qr img,.qr canvas{max-width:260px}.label{border:1px solid #aaa;padding:10px 8px;width:300px;margin:20px auto 0}.label .company{font-size:20px;font-weight:900}.label .machine{font-size:16px;font-weight:900;margin-top:7px}.mail{background:var(--off);border-left:3px solid var(--red);padding:13px;text-align:left;font-size:12px;white-space:pre-wrap;line-height:1.65}.note{margin-top:18px;background:var(--pale);border-left:3px solid var(--red);padding:12px 14px;font-size:12px;color:var(--sub)}
.batch{margin-top:18px}.batch-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.file{border:1px dashed #bbb;padding:12px;border-radius:7px;flex:1}.table-wrap{overflow:auto;margin-top:15px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{background:var(--off)}.empty{text-align:center;padding:30px;color:#999}
#printArea{display:none}
@media(max-width:850px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.title h1{font-size:32px}.owner{font-size:16px}}
@media print{
 @page{size:A4 portrait;margin:8mm}
 body.printing>*:not(#printArea){display:none!important}
 body.printing #printArea{display:block!important;width:100%}
 .print-page{width:194mm;height:281mm;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:5mm 4mm;page-break-after:always;break-after:page;align-items:center;justify-items:center}
 .print-page:last-child{page-break-after:auto;break-after:auto}
 .print-label{width:58mm;height:64mm;border:0.3mm solid #999;text-align:center;padding:2.5mm 2mm;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden}
 .print-label .company{font-size:13pt;font-weight:900;line-height:1.2;height:9mm;display:flex;align-items:center;justify-content:center;width:100%;overflow:hidden}
 .print-label .qr75{width:75px;height:75px;margin:2mm auto 2mm;display:flex;align-items:center;justify-content:center}
 .print-label .qr75 img{width:75px!important;height:75px!important}
 .print-label .machine{font-size:11pt;font-weight:900;line-height:1.15;margin-top:1mm;word-break:break-all}
 .print-label .model{font-size:8pt;margin-top:1mm;color:#333}
}
</style>
</head>
<body>
<nav class="nav"><div class="brand">RICOH <span>Smart Service Hub</span></div><a href="index.html">返回首頁</a></nav>
<main class="wrap">
<div class="title"><h1>QR Code 管理</h1><div class="owner">TY0032-Willie 製作<br>有問題請聯絡 TY0032</div></div>
<div class="desc">內部人員產生機器 QR 標籤。支援單筆建立與 CSV 批次匯入；QR Code 直接編碼報修 Email，客戶掃描後開啟手機 Email App。</div>
<div class="grid">
<section class="card"><h2>① 單筆建立 QR Code</h2>
<div class="form">
<div class="field"><label>客戶名稱</label><input id="company" value="台灣理光"></div>
<div class="field"><label>機型</label><input id="model" value="IMC6010"></div>
<div class="field"><label>機號</label><input id="machine" value="A123567890"></div>
<div class="field"><label>客服信箱</label><input id="email" value="rt@ricoh.com.tw"></div>
<div class="field full"><label>客戶地址</label><input id="address" value=""></div>
<div class="field"><label>聯絡人</label><input id="contact" value=""></div>
<div class="field"><label>聯絡方式</label><input id="phone" value=""></div>
</div>
<div class="actions"><button class="btn red" onclick="generate()">產生 QR Code</button><button class="btn" onclick="clearForm()">清除重填</button></div>
<div class="note">QR Code 掃描後會直接開啟手機 Email App，不需要先進入網站。</div>
</section>
<section class="card preview"><h2>QR Code 預覽</h2><div class="qr" id="qr"></div><div class="mail" id="mail">請先產生 QR Code</div>
<div class="label"><div class="company" id="pCompany">台灣理光</div><div class="qr" id="labelQR" style="width:75px;height:75px;margin:10px auto"></div><div class="machine" id="pMachine">A123567890</div></div>
<div class="actions" style="justify-content:center"><button class="btn red" onclick="downloadQR()">下載 PNG</button><button class="btn" onclick="printOne()">列印標籤</button></div></section>
</div>
<section class="card batch"><h2>② CSV 批次匯入</h2>
<div class="batch-top"><input class="file" type="file" id="csv" accept=".csv"><button class="btn" onclick="downloadTemplate()">下載 CSV 範本</button><button class="btn red" onclick="importCSV()">匯入並產生</button></div>
<div class="table-wrap"><table class="table"><thead><tr><th>客戶名稱</th><th>機型</th><th>機號</th><th>客戶地址</th><th>聯絡人</th><th>聯絡方式</th><th>客服信箱</th><th>操作</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="empty">尚未匯入資料</td></tr></tbody></table></div>
<div class="actions"><button class="btn" onclick="printBatch()">批次列印（每頁 12 張）</button><button class="btn" onclick="batch=[];render()">清除批次資料</button></div>
</section>
</main><div id="printArea"></div>
<script>
let current=null,batch=[];
function val(id){return document.getElementById(id).value.trim()}
function data(){return{company:val('company'),model:val('model'),machine:val('machine'),email:val('email')||'rt@ricoh.com.tw',address:val('address'),contact:val('contact'),phone:val('phone')}}
function mailto(d){let subject='RICOH QR Code 報修｜機號 '+d.machine;let body=['【RICOH QR Code 報修】','================================','客戶名稱：'+d.company,'機型：'+d.model,'機號：'+d.machine,'客戶地址：'+d.address,'聯絡人：'+d.contact,'聯絡方式：'+d.phone,'','【報修事項】','請填寫故障狀況：','','================================','本信件由 RICOH QR Code 報修標籤產生'].join('\n');return'mailto:'+d.email+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}
function draw(el,d,size=75){el.innerHTML='';return new QRCode(el,{text:mailto(d),width:size,height:size,colorDark:'#b00000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}
function generate(){current=data();draw(document.getElementById('qr'),current,260);draw(document.getElementById('labelQR'),current,75);document.getElementById('pCompany').textContent=current.company;document.getElementById('pMachine').textContent=current.machine;document.getElementById('mail').textContent=mailtoPreview(current)}
function mailtoPreview(d){return'收件人：'+d.email+'\n主旨：RICOH QR Code 報修｜機號 '+d.machine+'\n\n【RICOH QR Code 報修】\n================================\n客戶名稱：'+d.company+'\n機型：'+d.model+'\n機號：'+d.machine+'\n客戶地址：'+d.address+'\n聯絡人：'+d.contact+'\n聯絡方式：'+d.phone+'\n\n【報修事項】\n請填寫故障狀況：\n\n================================'}
function clearForm(){['address','contact','phone'].forEach(id=>document.getElementById(id).value='');generate()}
function downloadQR(){if(!current)generate();let c=document.querySelector('#qr canvas');if(!c)return;let a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='RICOH_QR_'+current.machine+'.png';a.click()}
function printOne(){if(!current)generate();let a=document.getElementById('printArea');a.innerHTML='<div class="print-page"><div class="print-label"><div class="company">'+esc(current.company)+'</div><div id="printQR" class="qr75"></div><div class="machine">'+esc(current.machine)+'</div><div class="model">'+esc(current.model)+'</div></div></div>';draw(document.getElementById('printQR'),current,75);document.body.classList.add('printing');setTimeout(()=>{window.print();document.body.classList.remove('printing')},200)}
function parseCSV(t){let lines=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];let h=lines[0].split(',').map(x=>x.trim().replace(/^"|"$/g,''));return lines.slice(1).map(line=>{let a=line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));let o={};h.forEach((k,i)=>o[k]=a[i]||'');return{company:o['客戶名稱']||o['公司']||'',model:o['機型']||'',machine:o['機器號碼']||o['機號']||'',address:o['客戶地址']||o['地址']||'',contact:o['聯絡人']||'',phone:o['聯絡方式']||o['電話']||'',email:o['客服信箱']||'rt@ricoh.com.tw'}})}
function importCSV(){let f=document.getElementById('csv').files[0];if(!f)return alert('請先選擇 CSV 檔案');let r=new FileReader();r.onload=e=>{batch=parseCSV(e.target.result).filter(x=>x.machine);render()};r.readAsText(f,'UTF-8')}
function render(){let tb=document.getElementById('rows');if(!batch.length){tb.innerHTML='<tr><td colspan="8" class="empty">尚未匯入資料</td></tr>';return}tb.innerHTML=batch.map((d,i)=>'<tr><td>'+esc(d.company)+'</td><td>'+esc(d.model)+'</td><td>'+esc(d.machine)+'</td><td>'+esc(d.address)+'</td><td>'+esc(d.contact)+'</td><td>'+esc(d.phone)+'</td><td>'+esc(d.email)+'</td><td><button class="btn" onclick="loadRow('+i+')">載入</button> <button class="btn" onclick="batch.splice('+i+',1);render()">刪除</button></td></tr>').join('')}
function loadRow(i){let d=batch[i];['company','model','machine','email','address','contact','phone'].forEach(k=>document.getElementById(k).value=d[k]);generate();scrollTo({top:0,behavior:'smooth'})}
function printBatch(){if(!batch.length)return alert('請先匯入 CSV 資料');let pages=[];for(let i=0;i<batch.length;i+=12){let chunk=batch.slice(i,i+12);pages.push('<div class="print-page">'+chunk.map((d,j)=>'<div class="print-label"><div class="company">'+esc(d.company)+'</div><div id="bqr'+i+'_'+j+'" class="qr75"></div><div class="machine">'+esc(d.machine)+'</div><div class="model">'+esc(d.model)+'</div></div>').join('')+'</div>')}document.getElementById('printArea').innerHTML=pages.join('');batch.forEach((d,i)=>{let page=Math.floor(i/12),j=i%12;draw(document.getElementById('bqr'+(page*12)+'_'+j),d,75)});document.body.classList.add('printing');setTimeout(()=>{window.print();document.body.classList.remove('printing')},500)}
function downloadTemplate(){let s='客戶名稱,機型,機號,客戶地址,聯絡人,聯絡方式,客服信箱\n台灣理光,IMC6010,A123567890,,,,rt@ricoh.com.tw';let b=new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='RICOH_QR_CSV範本.csv';a.click()}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
generate();
</script>
</body></html>
