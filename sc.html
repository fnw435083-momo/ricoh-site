<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SC Error 資料庫｜RICOH Smart Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--blue:#086bd1;--navy:#08295d;--ink:#17385e;--sub:#60758f;--line:#d8e6f3;--bg:#f3f8fd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",Arial,sans-serif;line-height:1.65}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 4%;gap:16px;position:sticky;top:0;z-index:5}.logo{font-size:22px;font-weight:900;color:#d5002b}.brand{border-left:1px solid var(--line);padding-left:14px}.brand b{display:block;color:var(--navy);font-size:18px}.brand small{color:var(--sub);font-size:10px}.back{margin-left:auto;font-size:12px;font-weight:800;color:var(--blue)}main{max-width:1280px;margin:auto;padding:34px 4% 55px}.hero{background:linear-gradient(120deg,#fff,#eaf6ff);border:1px solid var(--line);border-radius:16px;padding:28px 30px;margin-bottom:18px}.ey{font-size:10px;font-weight:900;letter-spacing:.15em;color:var(--blue)}h1{margin:5px 0 4px;color:var(--navy);font-size:32px}.hero p{margin:0;color:var(--sub);font-size:12px}.controls{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:1.5fr .8fr .8fr auto;gap:10px;align-items:center}.input,.select{width:100%;height:42px;border:1px solid #cbdceb;border-radius:8px;padding:0 12px;background:#fff;color:var(--ink);font-size:13px;outline:none}.clear{height:42px;padding:0 15px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.count{font-size:11px;color:var(--sub);white-space:nowrap}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:10px;color:#315677;cursor:pointer}.list{display:grid;gap:12px;margin-top:15px}.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px 20px}.item-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:900;color:var(--navy)}.badge{font-size:9px;font-weight:800;border-radius:999px;padding:4px 8px;background:#eaf5ff;color:var(--blue)}.badge.manual{background:#e9f8ed;color:#23733a}.badge.med{background:#fff6df;color:#9b6a00}.item h2{font-size:15px;margin:9px 0 4px;color:#17385e}.item p{font-size:11px;color:var(--sub);margin:5px 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.box{background:#f7fbff;border:1px solid #e5eff7;border-radius:8px;padding:10px 11px}.box b{font-size:10px;color:#315677}.box div{font-size:11px;margin-top:3px;white-space:pre-wrap}.zh{font-weight:800;color:#17385e}.en{color:#60758f}.source{margin-top:9px;font-size:9px;color:#7a8ca1}.source a{color:var(--blue);font-weight:700}.empty{padding:45px;text-align:center;color:var(--sub);background:#fff;border:1px dashed #cbdceb;border-radius:12px}.note{font-size:10px;color:#71859c;margin-top:15px}.note strong{color:#365a7e}@media(max-width:800px){.controls{grid-template-columns:1fr 1fr}.count{grid-column:1/-1}.clear{grid-column:1/-1}.cols{grid-template-columns:1fr}.top{padding:0 18px}.brand small{display:none}main{padding:24px 18px 45px}}
</style></head><body><header class="top"><div class="logo">RICOH</div><div class="brand"><b>Smart Hub｜SC Error</b><small>TY0032 Willie.lee 測試工具</small></div><a class="back" href="index.html">← 回 Smart Hub</a></header><main><section class="hero"><div class="ey">SERVICE CALL DATABASE</div><h1>SC Error 資料庫</h1><p>原廠 Service Manual 優先；英文原文保留，並提供中文工程翻譯，方便工程師快速判讀。</p></section><section class="controls"><input id="q" class="input" placeholder="搜尋 SC、中文、英文、故障原因、處置…"><select id="series" class="select"><option value="">全部機型系列</option></select><select id="cat" class="select"><option value="">全部分類</option></select><button id="clear" class="clear">清除</button><div id="count" class="count"></div></section><div id="chips" class="chips"></div><div id="list" class="list"></div><div class="note"><strong>資料原則：</strong>你的 IM C2000/C2500/C3000/C3500/C4500/C5500/C6000 原廠 Field Service Manual 為第一優先；同一 SC 若不同機型定義不同，不跨機型硬套。英文原文與中文翻譯分開顯示。</div></main><script>
const SUPABASE_URL='https://ppzdwearxmxrkqgcphvt.supabase.co',SUPABASE_KEY='sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb';const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let DATA=[];const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]));}function normalize(s){return String(s??'').toUpperCase().replace(/[\s_–—-]/g,'');}function matches(x,q){if(!q)return true;const n=normalize(q);const hay=[x.sc_code,x.series,x.category,x.error,x.error_en,x.error_zh,x.condition,x.condition_en,x.condition_zh,x.cause,x.cause_en,x.cause_zh,x.action,x.solution_en,x.solution_zh,x.source].join(' ');return normalize(hay).includes(n)||String(x.sc_code||'').replace(/\D/g,'')===String(q).replace(/\D/g,'');}
async function decodeOriginalIndex(){const a=await fetch('sc-imc-index-1.b64').then(r=>r.text()),b=await fetch('sc-imc-index-2.b64').then(r=>r.text());const bin=Uint8Array.from(atob(a+b),c=>c.charCodeAt(0));const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));const json=JSON.parse(await new Response(stream).text());return json.dict.rows.map(row=>Object.fromEntries(json.keys.map((k,i)=>[k,json.dict.dict[k][row[i]]])));}
function normalizeLegacy(x){return {...x,confidence:x.confidence||'high'};}function normalizeOriginal(x,legacy){return {...(legacy||{}),sc_code:x.sc_code,series:'IM C2000/C2500/C3000/C3500/C4500/C5500/C6000',category:'原廠手冊',error:x.error_en||'',error_en:x.error_en||'',error_zh:x.error_zh||'',source_type:'RICOH 原廠 Field Service Manual',source:'IM C2000/C2500/C3000/C3500/C4500/C5500/C6000 FSM Ver.1.0 (2018-12)',source_page:x.source_page,auto_reboot:x.auto_reboot,confidence:'manual'};}
function fillFilters(){const ss=[...new Set(DATA.flatMap(x=>String(x.series||'').split(';').map(s=>s.trim()).filter(Boolean)))].sort();$('series').innerHTML='<option value="">全部機型系列</option>'+ss.map(x=>`<option>${esc(x)}</option>`).join('');const cs=[...new Set(DATA.map(x=>x.category).filter(Boolean))].sort();$('cat').innerHTML='<option value="">全部分類</option>'+cs.map(x=>`<option>${esc(x)}</option>`).join('');const hot=['SC332-01','SC336-01','SC410-01','SC541-01','SC560-00','SC672-00'];$('chips').innerHTML=hot.map(x=>`<button class="chip" data-q="${x}">${x}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('q').value=b.dataset.q;render();});}
function render(){const q=$('q').value.trim(),s=$('series').value,c=$('cat').value;let arr=DATA.filter(x=>(!s||String(x.series||'').includes(s))&&(!c||x.category===c)&&matches(x,q));$('count').textContent=`顯示 ${arr.length} / ${DATA.length} 筆`;if(!arr.length){$('list').innerHTML='<div class="empty">找不到符合資料。</div>';return;}arr.sort((a,b)=>a.sc_code.localeCompare(b.sc_code,undefined,{numeric:true}));$('list').innerHTML=arr.map(x=>`<article class="item"><div class="item-head"><span class="code">${esc(x.sc_code)}</span><span class="badge ${x.confidence==='manual'?'manual':(x.confidence==='medium'?'med':'')}">${x.confidence==='manual'?'原廠手冊｜第一優先':(x.confidence==='high'?'高可信度':'需確認機型')}</span><span class="badge">${esc(x.category||'未分類')}</span></div><h2><span class="zh">${esc(x.error_zh||x.error||'')}</span>${x.error_en&&x.error_en!==x.error_zh?`<div class="en">${esc(x.error_en)}</div>`:''}</h2>${x.condition_zh||x.condition_en?`<div class="cols"><div class="box"><b>中文故障條件</b><div>${esc(x.condition_zh||x.condition||'')}</div></div><div class="box"><b>原廠英文故障條件</b><div>${esc(x.condition_en||x.condition||'')}</div></div></div>`:''}${x.cause_zh||x.cause_en?`<div class="cols"><div class="box"><b>中文主要原因</b><div>${esc(x.cause_zh||x.cause||'')}</div></div><div class="box"><b>原廠英文主要原因</b><div>${esc(x.cause_en||x.cause||'')}</div></div></div>`:''}${x.solution_zh||x.solution_en?`<div class="cols"><div class="box"><b>中文處置方法</b><div>${esc(x.solution_zh||x.action||'')}</div></div><div class="box"><b>原廠英文處置方法</b><div>${esc(x.solution_en||x.action||'')}</div></div></div>`:''}<p><b>適用機型：</b>${esc(x.series||'未指定')}${x.source_page?`　｜　<b>原廠頁碼：</b>${esc(x.source_page)}`:''}${typeof x.auto_reboot==='boolean'?`　｜　<b>自動重啟：</b>${x.auto_reboot?'是':'否'}`:''}</p><div class="source">來源：${esc(x.source_type||'')}｜${esc(x.source||'')} ${x.source_page?`｜ 原廠手冊頁 ${esc(x.source_page)}`:''}</div></article>`).join('');}
async function load(){try{const legacyReq=fetch('sc-data.json').then(r=>r.json()).catch(()=>({data:[]}));const dbReq=client.from('sc_manual_primary').select('*').order('sc_code');const originalReq=decodeOriginalIndex();const [legacy,db,original]=await Promise.all([legacyReq,dbReq,originalReq]);const map=new Map();for(const x of (legacy.data||[]))map.set(normalize(x.sc_code),normalizeLegacy(x));for(const x of (db.data||[]))map.set(normalize(x.sc_code),{...normalizeLegacy(x),confidence:'manual'});for(const x of original){const k=normalize(x.sc_code),legacy=map.get(k);map.set(k,normalizeOriginal(x,legacy));}DATA=[...map.values()];fillFilters();render();}catch(e){console.error(e);$('list').innerHTML='<div class="empty">原廠 SC 資料載入失敗：'+esc(e.message||e)+'</div>';}}
$('q').addEventListener('input',render);$('series').addEventListener('change',render);$('cat').addEventListener('change',render);$('clear').onclick=()=>{$('q').value='';$('series').value='';$('cat').value='';render();};load();
</script></body></html>
