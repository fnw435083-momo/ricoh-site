<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SC Error 資料庫｜RICOH Smart Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f3f8fd;color:#17385e;font-family:"Noto Sans TC",Arial,sans-serif}.top{height:68px;background:#fff;border-bottom:1px solid #d8e6f3;display:flex;align-items:center;padding:0 5%;gap:15px}.logo{font-size:22px;font-weight:900;color:#d5002b}.brand b{display:block;color:#08295d}.brand small{color:#60758f;font-size:10px}.back{margin-left:auto;color:#086bd1;font-weight:800;font-size:12px}main{max-width:1200px;margin:auto;padding:28px 4% 55px}.hero,.controls,.item{background:#fff;border:1px solid #d8e6f3;border-radius:14px}.hero{padding:26px;margin-bottom:16px;background:linear-gradient(120deg,#fff,#eaf6ff)}.ey{font-size:10px;font-weight:900;letter-spacing:.15em;color:#086bd1}h1{margin:5px 0;color:#08295d;font-size:32px}.hero p{margin:0;color:#60758f}.controls{padding:15px;display:grid;grid-template-columns:1.5fr .8fr .8fr auto;gap:9px}.input,.select,.clear{height:42px;border-radius:8px;box-sizing:border-box}.input,.select{width:100%;border:1px solid #cbdceb;padding:0 12px;background:#fff;font-size:13px}.clear{border:0;background:#086bd1;color:#fff;font-weight:800;padding:0 16px}.count{font-size:11px;color:#60758f;grid-column:1/-1}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid #d8e6f3;background:#fff;border-radius:99px;padding:5px 10px;color:#315677}.list{display:grid;gap:12px}.item{padding:18px}.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.code{font:900 18px monospace;color:#08295d}.badge{font-size:9px;font-weight:800;padding:4px 8px;border-radius:99px;background:#eaf5ff;color:#086bd1}.manual{background:#e9f8ed;color:#23733a}.item h2{font-size:15px;margin:9px 0 4px}.en{color:#60758f;font-size:12px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.box{background:#f7fbff;border:1px solid #e5eff7;border-radius:8px;padding:10px;font-size:11px}.box b{font-size:10px}.source{margin-top:9px;color:#7a8ca1;font-size:9px}.empty{padding:40px;text-align:center;background:#fff;border:1px dashed #cbdceb;border-radius:12px}@media(max-width:800px){.controls{grid-template-columns:1fr 1fr}.clear{grid-column:1/-1}.cols{grid-template-columns:1fr}.top{padding:0 18px}main{padding:22px 18px}} </style></head><body><header class="top"><div class="logo">RICOH</div><div class="brand"><b>Smart Hub｜SC Error</b><small>TY0032 Willie.lee 測試工具</small></div><a class="back" href="index.html">← 回 Smart Hub</a></header><main><section class="hero"><div class="ey">SERVICE CALL DATABASE</div><h1>SC Error 資料庫</h1><p>原廠 Service Manual 優先；英文原文保留，並提供中文工程翻譯。</p></section><section class="controls"><input id="q" class="input" placeholder="搜尋 SC、中文、英文、故障原因、處置…"><select id="series" class="select"><option value="">全部機型系列</option></select><select id="cat" class="select"><option value="">全部分類</option></select><button id="clear" class="clear">清除</button><div id="count" class="count"></div></section><div id="chips" class="chips"></div><div id="list" class="list"></div></main><script>const SUPABASE_URL='https://ppzdwearxmxrkqgcphvt.supabase.co',SUPABASE_KEY='sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb';const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let DATA=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s??'').toUpperCase().replace(/[\s_–—-]/g,'');function match(x,q){if(!q)return true;const n=norm(q),hay=[x.sc_code,x.series,x.category,x.error,x.error_en,x.error_zh,x.condition,x.condition_en,x.condition_zh,x.cause,x.cause_en,x.cause_zh,x.action,x.solution_en,x.solution_zh,x.source].join(' ');return norm(hay).includes(n)||String(x.sc_code||'').replace(/\D/g,'')===String(q).replace(/\D/g,'')}function normalizeLegacy(x){return {...x,confidence:x.confidence||'high'}}function normalizeOriginal(x,legacy){return {...(legacy||{}),sc_code:x.sc_code,series:'IM C2000/C2500/C3000/C3500/C4500/C5500/C6000',category:'原廠手冊',error:x.error_en||'',error_en:x.error_en||'',error_zh:x.error_zh||'',source_type:'RICOH 原廠 Field Service Manual',source:'IM C2000/C2500/C3000/C3500/C4500/C5500/C6000 FSM Ver.1.0 (2018-12)',source_page:x.source_page,auto_reboot:x.auto_reboot,confidence:'manual'}}async function decodeOriginalIndex(){const [ra,rb]=await Promise.all([fetch('sc-imc-index-1.b64'),fetch('sc-imc-index-2.b64')]);if(!ra.ok||!rb.ok)throw Error('原廠 SC 索引檔案無法讀取');const a=await ra.text(),b=await rb.text();const bin=Uint8Array.from(atob(a+b),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw Error('目前瀏覽器不支援資料解壓縮');const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));const json=JSON.parse(await new Response(stream).text());const meta=json.dict||{};const rows=json.rows||meta.rows||[];const keys=json.keys||meta.keys||[];const dictionaries=meta.dict||json.dicts||{};if(!rows.length||!keys.length)throw Error('原廠 SC 索引格式無法解析');return rows.map(row=>Object.fromEntries(keys.map((k,i)=>[k,dictionaries[k]?.[row[i]]??row[i]])))}function fill(){const ss=[...new Set(DATA.flatMap(x=>String(x.series||'').split(';').map(s=>s.trim()).filter(Boolean)))].sort();$('series').innerHTML='<option value="">全部機型系列</option>'+ss.map(x=>'<option>'+esc(x)+'</option>').join('');const cs=[...new Set(DATA.map(x=>x.category).filter(Boolean))].sort();$('cat').innerHTML='<option value="">全部分類</option>'+cs.map(x=>'<option>'+esc(x)+'</option>').join('');const hot=['SC332-01','SC336-01','SC410-01','SC541-01','SC560-00','SC672-00'];$('chips').innerHTML=hot.map(x=>'<button class="chip" data-q="'+x+'">'+x+'</button>').join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{$('q').value=b.dataset.q;render()})}function render(){const q=$('q').value.trim(),s=$('series').value,c=$('cat').value;let arr=DATA.filter(x=>(!s||String(x.series||'').includes(s))&&(!c||x.category===c)&&match(x,q));$('count').textContent='顯示 '+arr.length+' / '+DATA.length+' 筆';if(!arr.length){$('list').innerHTML='<div class="empty">找不到符合資料。</div>';return}arr.sort((a,b)=>a.sc_code.localeCompare(b.sc_code,undefined,{numeric:true}));$('list').innerHTML=arr.map(x=>'<article class="item"><div class="head"><span class="code">'+esc(x.sc_code)+'</span><span class="badge '+(x.confidence==='manual'?'manual':'')+'">'+(x.confidence==='manual'?'原廠手冊｜第一優先':x.confidence==='high'?'高可信度':'需確認機型')+'</span><span class="badge">'+esc(x.category||'未分類')+'</span></div><h2>'+esc(x.error_zh||x.error||'')+(x.error_en&&x.error_en!==x.error_zh?'<div class="en">'+esc(x.error_en)+'</div>':'')+'</h2>'+(x.condition_zh||x.condition_en?'<div class="cols"><div class="box"><b>中文故障條件</b><br>'+esc(x.condition_zh||x.condition||'')+'</div><div class="box"><b>原廠英文故障條件</b><br>'+esc(x.condition_en||x.condition||'')+'</div></div>':'')+(x.cause_zh||x.cause_en?'<div class="cols"><div class="box"><b>中文主要原因</b><br>'+esc(x.cause_zh||x.cause||'')+'</div><div class="box"><b>原廠英文主要原因</b><br>'+esc(x.cause_en||x.cause||'')+'</div></div>':'')+(x.solution_zh||x.solution_en?'<div class="cols"><div class="box"><b>中文處置方法</b><br>'+esc(x.solution_zh||x.action||'')+'</div><div class="box"><b>原廠英文處置方法</b><br>'+esc(x.solution_en||x.action||'')+'</div></div>':'')+'<p>適用機型：'+esc(x.series||'未指定')+(x.source_page?' ｜ 原廠頁碼：'+esc(x.source_page):'')+'</p><div class="source">來源：'+esc(x.source_type||'')+'｜'+esc(x.source||'')+'</div></article>').join('')}async function load(){try{const [legacy,db,original]=await Promise.all([fetch('sc-data.json').then(r=>r.json()).catch(()=>({data:[]})),client.from('sc_manual_primary').select('*').order('sc_code').then(r=>r.data||[]),decodeOriginalIndex()]);const map=new Map();for(const x of legacy.data||[])map.set(norm(x.sc_code),normalizeLegacy(x));for(const x of db)map.set(norm(x.sc_code),{...normalizeLegacy(x),confidence:'manual'});for(const x of original)map.set(norm(x.sc_code),normalizeOriginal(x,map.get(norm(x.sc_code))));DATA=[...map.values()];fill();render()}catch(e){console.error(e);$('list').innerHTML='<div class="empty">原廠 SC 資料載入失敗：'+esc(e.message||e)+'</div>'}}$('q').oninput=render;$('series').onchange=render;$('cat').onchange=render;$('clear').onclick=()=>{$('q').value='';$('series').value='';$('cat').value='';render()};load();</script></body></html>
