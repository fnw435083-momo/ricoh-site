<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SC Error 資料庫｜RICOH Smart Hub</title>
<style>
:root{--blue:#086bd1;--navy:#08295d;--ink:#17385e;--sub:#60758f;--line:#d8e6f3;--bg:#f3f8fd;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",Arial,sans-serif;line-height:1.65}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 4%;gap:16px;position:sticky;top:0;z-index:5}.logo{font-size:22px;font-weight:900;color:#d5002b}.brand{border-left:1px solid var(--line);padding-left:14px}.brand b{display:block;color:var(--navy);font-size:18px}.brand small{color:var(--sub);font-size:10px}.back{margin-left:auto;font-size:12px;font-weight:800;color:var(--blue)}main{max-width:1280px;margin:auto;padding:34px 4% 55px}.hero{background:linear-gradient(120deg,#fff,#eaf6ff);border:1px solid var(--line);border-radius:16px;padding:28px 30px;margin-bottom:18px}.ey{font-size:10px;font-weight:900;letter-spacing:.15em;color:var(--blue)}h1{margin:5px 0 4px;color:var(--navy);font-size:32px}.hero p{margin:0;color:var(--sub);font-size:12px}.controls{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:1.5fr .8fr .8fr auto;gap:10px;align-items:center}.input,.select{width:100%;height:42px;border:1px solid #cbdceb;border-radius:8px;padding:0 12px;background:#fff;color:var(--ink);font-size:13px;outline:none}.input:focus,.select:focus{border-color:#75aee0;box-shadow:0 0 0 3px #086bd112}.count{font-size:11px;color:var(--sub);white-space:nowrap}.clear{height:42px;padding:0 15px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:10px;color:#315677;cursor:pointer}.chip:hover{border-color:#8bbce5;color:var(--blue)}.list{display:grid;gap:12px;margin-top:15px}.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px 20px}.item-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:900;color:var(--navy)}.badge{font-size:9px;font-weight:800;border-radius:999px;padding:4px 8px;background:#eaf5ff;color:var(--blue)}.badge.med{background:#fff6df;color:#9b6a00}.item h2{font-size:14px;margin:8px 0 4px;color:#17385e}.item p{font-size:11px;color:var(--sub);margin:4px 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.box{background:#f7fbff;border:1px solid #e5eff7;border-radius:8px;padding:9px 11px}.box b{font-size:10px;color:#315677}.box div{font-size:11px;margin-top:2px}.source{margin-top:9px;font-size:9px;color:#7a8ca1}.source a{color:var(--blue);font-weight:700}.empty{padding:45px;text-align:center;color:var(--sub);background:#fff;border:1px dashed #cbdceb;border-radius:12px}.note{font-size:10px;color:#71859c;margin-top:15px}.note strong{color:#365a7e}@media(max-width:800px){.controls{grid-template-columns:1fr 1fr}.count{grid-column:1/-1}.clear{grid-column:1/-1}.cols{grid-template-columns:1fr}.top{padding:0 18px}.brand small{display:none}main{padding:24px 18px 45px}}
</style></head>
<body>
<header class="top"><div class="logo">RICOH</div><div class="brand"><b>Smart Hub｜SC Error</b><small>TY0032 Willie.lee 測試工具</small></div><a class="back" href="index.html">← 回 Smart Hub</a></header>
<main>
<section class="hero"><div class="ey">SERVICE CALL DATABASE</div><h1>SC Error 資料庫</h1><p>以 RICOH 官方資料與對應 Field Service Manual 為優先，先建立可搜尋的工程資料底座。</p></section>
<section class="controls"><input id="q" class="input" placeholder="搜尋 SC，例如 SC541、541、thermistor、toner…"><select id="series" class="select"><option value="">全部機型系列</option></select><select id="cat" class="select"><option value="">全部分類</option></select><button id="clear" class="clear">清除</button><div id="count" class="count"></div></section>
<div id="chips" class="chips"></div>
<div id="list" class="list"></div>
<div class="note"><strong>資料原則：</strong>同一 SC 編號若跨不同機型，不代表故障定義與維修流程完全相同；精確維修前請確認機型、完整 SC sub-code 與對應 Service Manual。資料庫中的「官方」與「Field Service Manual」來源會分開標示。</div>
</main>
<script>
let DATA=[];
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]));}
function normalize(s){return String(s??'').toUpperCase().replace(/[\s_–—-]/g,'');}
function matches(x,q){if(!q)return true;const n=normalize(q);const hay=[x.sc_code,x.series,x.category,x.error,x.condition,x.action,x.related_parts,x.source].join(' ');return normalize(hay).includes(n)||normalize(x.sc_code).includes(n)||String(x.sc_code).replace(/\D/g,'')===String(q).replace(/\D/g,'');}
function fillFilters(){const ss=[...new Set(DATA.flatMap(x=>String(x.series||'').split(';').map(s=>s.trim()).filter(Boolean)))].sort();$('series').innerHTML='<option value="">全部機型系列</option>'+ss.map(x=>`<option>${esc(x)}</option>`).join('');const cs=[...new Set(DATA.map(x=>x.category).filter(Boolean))].sort();$('cat').innerHTML='<option value="">全部分類</option>'+cs.map(x=>`<option>${esc(x)}</option>`).join('');const hot=['SC332-01','SC336-01','SC410-01','SC541-01','SC497-00','SC560-00'];$('chips').innerHTML=hot.map(x=>`<button class="chip" data-q="${x}">${x}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ $('q').value=b.dataset.q;render();});}
function render(){const q=$('q').value.trim(), s=$('series').value, c=$('cat').value;let arr=DATA.filter(x=>(!s||String(x.series||'').includes(s))&&(!c||x.category===c)&&matches(x,q));$('count').textContent=`顯示 ${arr.length} / ${DATA.length} 筆`;if(!arr.length){$('list').innerHTML='<div class="empty">找不到符合資料。試試 SC541、332、toner、fusing、IM C3000。</div>';return;}arr.sort((a,b)=>a.sc_code.localeCompare(b.sc_code,undefined,{numeric:true}));$('list').innerHTML=arr.map(x=>`<article class="item"><div class="item-head"><span class="code">${esc(x.sc_code)}</span><span class="badge ${x.confidence==='medium'?'med':''}">${x.confidence==='high'?'高可信度':'需確認機型'}</span><span class="badge">${esc(x.category||'未分類')}</span></div><h2>${esc(x.error)}</h2>${x.condition?`<p><b>故障條件：</b>${esc(x.condition)}</p>`:''}<div class="cols"><div class="box"><b>工程師先做</b><div>${esc(x.action||'請依對應 Service Manual 檢查。')}</div></div><div class="box"><b>適用機型 / 系列</b><div>${esc(x.series||'未指定')}</div></div></div>${x.related_parts?`<p><b>關聯零件：</b>${esc(x.related_parts)}</p>`:''}<div class="source">來源：${esc(x.source_type)}｜${esc(x.source)} ｜ <a href="${esc(x.source_url)}" target="_blank" rel="noopener">查看來源 ↗</a></div></article>`).join('');}
fetch('sc-data.json').then(r=>r.json()).then(j=>{DATA=j.data||[];fillFilters();render();}).catch(e=>{$('list').innerHTML='<div class="empty">SC 資料載入失敗，請重新整理。</div>';console.error(e)});
$('q').addEventListener('input',render);$('series').addEventListener('change',render);$('cat').addEventListener('change',render);$('clear').onclick=()=>{$('q').value='';$('series').value='';$('cat').value='';render();};
</script></body></html>
