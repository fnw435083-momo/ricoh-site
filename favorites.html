<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的收藏｜RICOH Smart Hub</title><style>body{margin:0;background:#f4f8fc;font-family:"Noto Sans TC",Arial,sans-serif;color:#173456}.top{padding:17px 5%;background:#08295d;color:#fff;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:1000px;margin:auto;padding:30px 20px}.panel,.item{background:#fff;border:1px solid #dbe8f5;border-radius:13px;padding:18px;margin-bottom:14px}.item{display:flex;justify-content:space-between;gap:12px}.item a{color:#0878e8;font-weight:800;text-decoration:none}.btn{border:1px solid #dbe8f5;background:#fff;border-radius:7px;padding:6px 9px}.sub{font-size:11px;color:#60758f}.empty{text-align:center;padding:30px;color:#60758f}@media(max-width:650px){.item{flex-direction:column}}</style></head><body><header class="top"><a href="index.html">RICOH Smart Hub</a><a href="search.html">⌕ 工程搜尋</a></header><main class="wrap"><h1>我的工程工作區</h1><section class="panel"><h2>★ 我的收藏</h2><div id="fav"></div></section><section class="panel"><h2>最近使用</h2><div id="recent"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="analytics.js"></script><script>function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function load(){let f=[],r=[];try{f=JSON.parse(localStorage.getItem('ricoh_smart_hub_favorites')||'[]');r=JSON.parse(localStorage.getItem('ricoh_smart_hub_recent')||'[]')}catch(_){};document.getElementById('fav').innerHTML=f.length?f.map(x=>'<div class="item"><div><a href="'+x.url+'">'+esc(x.title)+'</a><div class="sub">'+esc(x.url)+'</div></div><button class="btn" data-key="'+esc(x.key||x.url)+'">移除</button></div>').join(''):'<div class="empty">還沒有收藏。到工程搜尋結果按「☆ 收藏」即可。</div>';document.getElementById('recent').innerHTML=r.length?r.slice(0,20).map(x=>'<div class="item"><div><a href="'+x.url+'">'+esc(x.title)+'</a><div class="sub">'+new Date(x.at).toLocaleString('zh-TW')+'</div></div></div>').join(''):'<div class="empty">目前沒有最近使用紀錄。</div>';document.querySelectorAll('#fav button').forEach(b=>b.onclick=()=>{window.ricohFavorite?.({key:b.dataset.key});load()})}setTimeout(load,300)</script></body></html>
