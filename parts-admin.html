<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>零件資料庫管理｜RICOH Smart Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:"Noto Sans TC",Arial,sans-serif;background:#f5f9fd;color:#173456}.nav{height:64px;background:linear-gradient(100deg,#061d46,#0a4f9e 58%,#087bdc);display:flex;align-items:center;justify-content:space-between;padding:0 5%;color:#fff}.nav a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:1200px;margin:auto;padding:28px 20px 60px}.panel{background:#fff;border:1px solid #dbe8f5;border-radius:14px;padding:20px;margin:16px 0}.title{font-size:30px;font-weight:900;color:#0b2d59}.sub{color:#60758f;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.input{width:100%;box-sizing:border-box;border:1px solid #c9d9e8;border-radius:8px;padding:11px;font-size:13px;margin-top:6px}.label{font-size:11px;font-weight:800;color:#315677}.btn{border:0;border-radius:8px;padding:10px 15px;background:#0878e8;color:#fff;font-weight:800;cursor:pointer}.btn.gray{background:#eef5fc;color:#315677}.btn.red{background:#fff0f0;color:#b32626;border:1px solid #f0caca}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.msg{padding:10px;border-radius:8px;margin-top:10px;font-size:12px}.ok{background:#edf9f1;color:#21733b}.err{background:#fff2f2;color:#a32626}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar .input{margin:0;flex:1;min-width:220px}table{width:100%;border-collapse:collapse;font-size:11px;margin-top:12px}th,td{padding:9px 7px;border-bottom:1px solid #e6eef6;text-align:left;vertical-align:top}th{background:#f8fbfe;color:#52708d}.mono{font-family:Consolas,monospace;color:#0874d8;font-weight:900}.count{font-size:11px;color:#60758f}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><header class="nav"><a href="index.html">RICOH Smart Hub</a><a href="parts.html">← 回零件資料庫</a></header><main class="wrap"><div class="title">工程零件資料庫管理</div><div class="sub">直接連接 Supabase 雲端資料庫，可新增、修改、刪除、搜尋與 CSV 備份／匯入。</div><section class="panel"><h3 id="formTitle">新增零件</h3><div class="grid"><div><div class="label">料號 *</div><input id="partsNo" class="input" placeholder="例如 D0BK2205"></div><div><div class="label">零件名稱</div><input id="name" class="input"></div><div class="full"><div class="label">適用機型</div><input id="models" class="input" placeholder="例如 IM C3000；IM C3500"></div><div><div class="label">名稱狀態</div><input id="status" class="input"></div><div><div class="label">原始名稱</div><input id="originalNames" class="input"></div></div><div class="actions"><button id="save" class="btn">儲存</button><button id="cancel" class="btn gray" style="display:none">取消編輯</button></div><div id="msg"></div></section><section class="panel"><div class="toolbar"><input id="search" class="input" placeholder="搜尋料號、名稱或機型"><span id="count" class="count"></span><button id="reload" class="btn gray">重新整理</button></div><div id="list"><div class="sub" style="padding:20px">正在載入…</div></div></section><section class="panel"><h3>CSV 備份／匯入</h3><div class="sub">匯出全部雲端零件資料；匯入格式：料號、零件名稱、適用機型、名稱狀態、原始名稱。</div><div class="actions"><button id="export" class="btn">📥 匯出全部 CSV</button><input id="csv" type="file" accept=".csv,text/csv" class="input" style="max-width:320px"><button id="import" class="btn gray">📤 匯入 CSV</button></div><div id="csvMsg"></div></section></main><script>const URL='https://ppzdwearxmxrkqgcphvt.supabase.co',KEY='sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb';const db=supabase.createClient(URL,KEY);let ALL=[],editId=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function show(id,t,e=false){$(id).innerHTML=t?'<div class="msg '+(e?'err':'ok')+'">'+esc(t)+'</div>':''}async function load(){const r=await db.from('parts').select('*').order('parts_no');if(r.error){show('msg','資料載入失敗：'+r.error.message,true);return}ALL=r.data||[];render()}function variants(s){const out=[];for(const g of String(s||'').toUpperCase().split(/[;；、,\n]+/)){const t=g.trim();if(!t)continue;const m=t.match(/^(.*?)(\d+(?:\s*\/\s*\d+)*)$/);if(m){const p=m[1].replace(/[^A-Z]/g,'');m[2].match(/\d+/g).forEach(n=>{out.push(n);if(p)out.push(p+n)})}out.push(t.replace(/[^A-Z0-9]/g,''))}return [...new Set(out)]}function hitModel(models,q){const x=String(q||'').toUpperCase().replace(/[^A-Z0-9]/g,'');return variants(models).some(v=>v===x)}function render(){const q=$('search').value.trim(),u=q.toUpperCase();const rows=ALL.filter(x=>!q||hitModel(x.models,q)||[x.parts_no,x.name,x.original_names,x.status].join(' ').toUpperCase().includes(u));$('count').textContent=rows.length+' 筆';if(!rows.length){$('list').innerHTML='<div class="sub" style="padding:25px">沒有符合資料</div>';return}$('list').innerHTML='<table><thead><tr><th>料號</th><th>名稱</th><th>適用機型</th><th>操作</th></tr></thead><tbody>'+rows.map(x=>'<tr><td class="mono">'+esc(x.parts_no)+'</td><td>'+esc(x.name||'')+'<br><span class="sub">'+esc(x.original_names||'')+'</span></td><td>'+esc(x.models||'')+'</td><td><button class="btn gray" onclick="editPart('+x.id+')">修改</button> <button class="btn red" onclick="delPart('+x.id+')">刪除</button></td></tr>').join('')+'</tbody></table>'}function clearForm(){$('formTitle').textContent='新增零件';editId=null;['partsNo','name','models','status','originalNames'].forEach(id=>$(id).value='');$('cancel').style.display='none'}window.editPart=id=>{const x=ALL.find(v=>v.id===id);if(!x)return;editId=id;$('formTitle').textContent='修改零件';$('partsNo').value=x.parts_no||'';$('name').value=x.name||'';$('models').value=x.models||'';$('status').value=x.status||'';$('originalNames').value=x.original_names||'';$('cancel').style.display='inline-block';window.scrollTo({top:0,behavior:'smooth'})};window.delPart=async id=>{const x=ALL.find(v=>v.id===id);if(!x||!confirm('確定刪除 '+x.parts_no+'？'))return;const r=await db.from('parts').delete().eq('id',id);if(r.error){show('msg','刪除失敗：'+r.error.message,true);return}show('msg','已刪除 '+x.parts_no);await load()};$('save').onclick=async()=>{const parts_no=$('partsNo').value.trim();if(!parts_no){show('msg','請輸入料號。',true);return}const row={parts_no,name:$('name').value.trim(),models:$('models').value.trim(),status:$('status').value.trim(),original_names:$('originalNames').value.trim(),updated_at:new Date().toISOString()};const r=editId?await db.from('parts').update(row).eq('id',editId):await db.from('parts').insert(row);if(r.error){show('msg','儲存失敗：'+r.error.message+(r.error.code==='23505'?'（料號已存在）':''),true);return}show('msg',editId?'已更新 '+parts_no:'已新增 '+parts_no);clearForm();await load()};$('cancel').onclick=clearForm;$('search').oninput=render;$('reload').onclick=load;function cell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}$('export').onclick=()=>{const h=['料號','零件名稱','適用機型','名稱狀態','原始名稱','建立時間','最後更新時間'];const b=ALL.map(x=>[x.parts_no,x.name,x.models,x.status,x.original_names,x.created_at,x.updated_at].map(cell).join(','));const blob=new Blob(['\uFEFF'+[h.map(cell).join(','),...b].join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RICOH_parts_backup_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href)};$('import').onclick=async()=>{const f=$('csv').files[0];if(!f){show('csvMsg','請先選擇 CSV。',true);return}try{const text=await f.text();const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);if(lines.length<2)throw Error('CSV 沒有資料');const parse=s=>{const a=[];let cur='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===','&&!q){a.push(cur);cur=''}else cur+=c}a.push(cur);return a};const head=parse(lines[0]).map(x=>x.trim());const idx=n=>head.findIndex(x=>x===n);const ip=idx('料號'),inm=idx('零件名稱'),im=idx('適用機型'),is=idx('名稱狀態'),io=idx('原始名稱');if(ip<0)throw Error('找不到「料號」欄位');let ok=0;for(let i=1;i<lines.length;i++){const a=parse(lines[i]);const row={parts_no:a[ip]||'',name:inm>=0?a[inm]||'':'',models:im>=0?a[im]||'':'',status:is>=0?a[is]||'':'',original_names:io>=0?a[io]||'':'',updated_at:new Date().toISOString()};if(!row.parts_no)continue;const r=await db.from('parts').upsert(row,{onConflict:'parts_no'});if(!r.error)ok++}show('csvMsg','匯入完成，共處理 '+ok+' 筆');await load()}catch(e){show('csvMsg','匯入失敗：'+e.message,true)}};load();</script></body></html>
