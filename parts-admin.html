<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>零件資料庫管理｜RICOH Smart Service Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#0878e8;--navy:#08295d;--ink:#173456;--sub:#60758f;--line:#dbe8f5;--danger:#c62828}*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans TC',Arial,sans-serif;color:var(--ink);background:#f5f9fd}.nav{height:64px;background:linear-gradient(100deg,#061d46,#0a4f9e 58%,#087bdc);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,5%)}.brand{font-weight:900;font-size:20px}.brand span{font-size:11px;font-weight:500;margin-left:10px;color:#dff6ff}.back{font-size:12px;font-weight:700}.wrap{max-width:1200px;margin:auto;padding:34px 20px 70px}.kicker{font-size:10px;font-weight:900;letter-spacing:.15em;color:var(--blue);text-transform:uppercase}.title{font-size:32px;font-weight:900;color:#0b2d59;margin:6px 0}.desc{font-size:13px;color:var(--sub);line-height:1.8}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:18px;box-shadow:0 8px 28px #0b5ca00b}.login{max-width:480px;margin:30px auto}.input{width:100%;border:1px solid #c9d9e8;border-radius:9px;padding:12px;font-size:14px;margin-top:8px}.label{font-size:12px;font-weight:800;color:#315677;display:block;margin-top:12px}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff}.btn.secondary{background:#eef5fc;color:#315677}.btn.danger{background:#fff0f0;color:var(--danger);border:1px solid #f0caca}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.msg{padding:11px 13px;border-radius:9px;font-size:12px;line-height:1.7;margin-top:12px}.ok{background:#edf9f1;color:#21733b;border:1px solid #bfe4ca}.err{background:#fff2f2;color:#a32626;border:1px solid #f1c5c5}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar .input{margin:0;flex:1;min-width:220px}.count{font-size:12px;color:var(--sub)}table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12px}th,td{text-align:left;border-bottom:1px solid #e6eef6;padding:11px 8px;vertical-align:top}th{color:#52708d;background:#f8fbfe}.mono{font-family:Consolas,monospace;color:#0874d8;font-weight:900}.small{font-size:11px;color:#72879d}.hidden{display:none!important}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.userbar{font-size:11px;color:#6b8198;display:flex;justify-content:space-between;gap:10px;align-items:center}.footer{text-align:center;color:#8aa0b6;font-size:10px;margin-top:40px}@media(max-width:760px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}table{display:block;overflow:auto;white-space:nowrap}.title{font-size:27px}}
</style>
</head>
<body>
<header class="nav"><a class="brand" href="index.html">RICOH <span>Smart Service Hub｜工程師工作中心</span></a><a class="back" href="parts.html">← 回零件資料庫</a></header>
<main class="wrap">
<div><div class="kicker">Parts Admin</div><div class="title">工程零件資料庫管理</div><div class="desc">新增、修改、刪除與同步零件資料。資料儲存在 Supabase 雲端，登入後才能修改。</div></div>
<section id="loginPanel" class="panel login">
<h3>工程師登入</h3>
<label class="label">Email</label><input id="email" class="input" type="email" autocomplete="email">
<label class="label">密碼</label><input id="password" class="input" type="password" autocomplete="current-password">
<div class="actions"><button id="login" class="btn">登入</button><button id="signup" class="btn secondary">建立帳號</button></div>
<div id="loginMsg"></div>
<p class="small">第一次使用請先建立帳號；若 Supabase 要求 Email 驗證，請先完成信箱驗證。</p>
</section>
<section id="adminPanel" class="hidden">
<div class="panel"><div class="userbar"><span id="userInfo"></span><button id="logout" class="btn secondary">登出</button></div></div>
<section class="panel">
<h3 id="formTitle">新增零件</h3>
<div class="formgrid">
<div><label class="label">料號 *</label><input id="partsNo" class="input" placeholder="例如 D0BK2205"></div>
<div><label class="label">零件名稱</label><input id="name" class="input" placeholder="例如 PCU K"></div>
<div class="full"><label class="label">適用機型</label><input id="models" class="input" placeholder="例如 IM C3000；IM C3500"></div>
<div><label class="label">名稱狀態</label><input id="status" class="input" placeholder="例如 名稱一致"></div>
<div><label class="label">原始名稱</label><input id="originalNames" class="input" placeholder="例如 PCU K；PCU-K"></div>
</div>
<div class="actions"><button id="save" class="btn">儲存</button><button id="cancel" class="btn secondary hidden">取消編輯</button></div><div id="saveMsg"></div>
</section>
<section class="panel">
<h3>既有資料同步</h3>
<p class="small">第一次使用時，可把目前網站上的既有零件資料一次匯入 Supabase。之後以雲端資料為主。</p>
<div class="actions"><button id="importExisting" class="btn secondary">同步目前既有資料</button><input id="csvFile" type="file" accept=".csv,text/csv" class="input" style="max-width:320px"><button id="importCsv" class="btn secondary">匯入 CSV</button></div><div id="importMsg"></div>
</section>
<section class="panel">
<div class="toolbar"><input id="search" class="input" placeholder="搜尋料號、名稱或機型"><span id="count" class="count"></span></div>
<div id="list"><div class="small" style="padding:20px 0">正在載入…</div></div>
</section>
</section>
<div class="footer">TY0032-Willie 製作｜RICOH Smart Service Hub</div>
</main>
<script>
const SUPABASE_URL='https://ppzdwearxmxrkqgcphvt.supabase.co';
const SUPABASE_KEY='sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let editingId=null, ALL=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(id,text,type='ok'){ $(id).innerHTML=text?'<div class="msg '+type+'">'+esc(text)+'</div>':''; }
function normalizeModel(s){return String(s??'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function normalizeRows(payload){const rows=Array.isArray(payload)?payload:(payload.master||[]);return rows.map(x=>{if(!Array.isArray(x))return null;if(x.length===5)return {parts_no:x[0],name:x[1],status:x[3],original_names:x[4],models:x[2]};return null}).filter(x=>x&&x.parts_no);}
function decodeBase64(s){s=String(s).replace(/^\uFEFF/,'').replace(/\s/g,'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const table='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';const out=new Uint8Array(Math.floor(s.length*3/4));let buffer=0,bits=0,pos=0;for(let i=0;i<s.length;i++){const c=s[i];if(c==='=')break;const v=table.indexOf(c);if(v<0)throw new Error('Base64 資料異常');buffer=(buffer<<6)|v;bits+=6;if(bits>=8){bits-=8;out[pos++]=(buffer>>bits)&255;}}return out.slice(0,pos)}
async function ungzip(bytes){const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return await new Response(stream).text()}
async function loadLegacy(){const r=await fetch('parts-data.json?v=20260910',{cache:'no-store'});if(!r.ok)throw new Error('既有資料載入失敗 HTTP '+r.status);const raw=(await r.text()).trim();if(raw.startsWith('{')||raw.startsWith('['))return normalizeRows(JSON.parse(raw));return normalizeRows(JSON.parse(await ungzip(decodeBase64(raw))))}
async function session(){const {data}=await client.auth.getSession();return data.session}
async function loadParts(){const {data,error}=await client.from('parts').select('*').order('parts_no');if(error)throw error;ALL=data||[];renderList()}
function renderList(){const q=$('search').value.trim().toUpperCase();const hit=ALL.filter(x=>(x.parts_no+' '+(x.name||'')+' '+(x.models||'')+' '+(x.original_names||'')).toUpperCase().includes(q));$('count').textContent=hit.length+' 筆';if(!hit.length){$('list').innerHTML='<div class="small" style="padding:25px 0">沒有資料</div>';return}$('list').innerHTML='<table><thead><tr><th>料號</th><th>名稱</th><th>適用機型</th><th>操作</th></tr></thead><tbody>'+hit.map(x=>'<tr><td class="mono">'+esc(x.parts_no)+'</td><td>'+esc(x.name||'')+'<div class="small">'+esc(x.original_names||'')+'</div></td><td>'+esc(x.models||'')+'</td><td><button class="btn secondary" onclick="editPart('+x.id+')">修改</button> <button class="btn danger" onclick="deletePart('+x.id+')">刪除</button></td></tr>').join('')+'</tbody></table>'}
function clearForm(){editingId=null;$('formTitle').textContent='新增零件';$('partsNo').value='';$('name').value='';$('models').value='';$('status').value='';$('originalNames').value='';$('partsNo').disabled=false;$('cancel').classList.add('hidden')}
window.editPart=id=>{const x=ALL.find(v=>v.id===id);if(!x)return;editingId=id;$('formTitle').textContent='修改零件';$('partsNo').value=x.parts_no||'';$('name').value=x.name||'';$('models').value=x.models||'';$('status').value=x.status||'';$('originalNames').value=x.original_names||'';$('partsNo').disabled=true;$('cancel').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
window.deletePart=async id=>{const x=ALL.find(v=>v.id===id);if(!x||!confirm('確定刪除 '+x.parts_no+'？'))return;const {error}=await client.from('parts').delete().eq('id',id);if(error){msg('saveMsg','刪除失敗：'+error.message,'err');return}msg('saveMsg','已刪除 '+x.parts_no);await loadParts()}
$('save').onclick=async()=>{const parts_no=$('partsNo').value.trim();if(!parts_no){msg('saveMsg','請輸入料號。','err');return}const row={parts_no,name:$('name').value.trim(),models:$('models').value.trim(),status:$('status').value.trim(),original_names:$('originalNames').value.trim(),updated_at:new Date().toISOString()};let res;if(editingId)res=await client.from('parts').update(row).eq('id',editingId);else res=await client.from('parts').insert(row);if(res.error){msg('saveMsg','儲存失敗：'+res.error.message,'err');return}msg('saveMsg',editingId?'已更新 '+parts_no:'已新增 '+parts_no);clearForm();await loadParts()};
$('cancel').onclick=()=>clearForm();$('search').oninput=renderList;
$('login').onclick=async()=>{msg('loginMsg','');const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg('loginMsg','登入失敗：'+error.message,'err');return}await init()};
$('signup').onclick=async()=>{msg('loginMsg','');const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){msg('loginMsg','請輸入 Email，密碼至少 6 碼。','err');return}const {error}=await client.auth.signUp({email,password});if(error){msg('loginMsg','建立帳號失敗：'+error.message,'err');return}msg('loginMsg','帳號建立成功。若收到驗證信，請先完成 Email 驗證，再回來登入。')};
$('logout').onclick=async()=>{await client.auth.signOut();location.reload()};
$('importExisting').onclick=async()=>{if(!await session()){msg('importMsg','請先登入。','err');return}if(!confirm('會把目前 parts-data.json 的既有資料同步到雲端，重複料號會更新。確定？'))return;try{const rows=await loadLegacy();let done=0;for(let i=0;i<rows.length;i+=50){const {error}=await client.from('parts').upsert(rows.slice(i,i+50),{onConflict:'parts_no'});if(error)throw error;done+=Math.min(50,rows.length-i);msg('importMsg','同步中：'+done+' / '+rows.length)}msg('importMsg','同步完成，共 '+rows.length+' 筆。');await loadParts()}catch(e){msg('importMsg','同步失敗：'+e.message,'err')}};
function parseCsv(text){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(quote&&n==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);if(row.some(v=>v.trim()))rows.push(row)}return rows}
$('importCsv').onclick=async()=>{if(!await session()){msg('importMsg','請先登入。','err');return}const f=$('csvFile').files[0];if(!f){msg('importMsg','請先選擇 CSV。','err');return}try{const text=await f.text();const rows=parseCsv(text);if(rows.length<2)throw new Error('CSV 沒有資料');const h=rows[0].map(v=>v.trim());const idx=n=>h.findIndex(v=>v===n);const iNo=idx('料號')>=0?idx('料號'):idx('parts_no');if(iNo<0)throw new Error('找不到「料號」欄位');const iName=idx('零件名稱'),iModels=idx('適用機型'),iStatus=idx('名稱狀態'),iOrig=idx('原始名稱');const data=rows.slice(1).map(r=>({parts_no:(r[iNo]||'').trim(),name:iName>=0?(r[iName]||'').trim():'',models:iModels>=0?(r[iModels]||'').trim():'',status:iStatus>=0?(r[iStatus]||'').trim():'',original_names:iOrig>=0?(r[iOrig]||'').trim():'',updated_at:new Date().toISOString()})).filter(x=>x.parts_no);for(let i=0;i<data.length;i+=50){const {error}=await client.from('parts').upsert(data.slice(i,i+50),{onConflict:'parts_no'});if(error)throw error}msg('importMsg','CSV 匯入完成，共 '+data.length+' 筆。');await loadParts()}catch(e){msg('importMsg','CSV 匯入失敗：'+e.message,'err')}};
async function init(){const s=await session();if(!s){$('loginPanel').classList.remove('hidden');$('adminPanel').classList.add('hidden');return}$('loginPanel').classList.add('hidden');$('adminPanel').classList.remove('hidden');$('userInfo').textContent='已登入：'+s.user.email;try{await loadParts()}catch(e){msg('saveMsg','資料載入失敗：'+e.message,'err')}}
init();
</script>
</body>
</html>
