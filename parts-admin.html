<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>零件資料庫管理｜RICOH Smart Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC",Arial,sans-serif;background:#f5f9fd;color:#173456}.nav{height:64px;background:linear-gradient(100deg,#061d46,#0a4f9e 58%,#087bdc);display:flex;align-items:center;justify-content:space-between;padding:0 5%;color:#fff}.nav a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:1200px;margin:auto;padding:28px 20px 60px}.title{font-size:30px;font-weight:900;color:#0b2d59}.sub{color:#60758f;font-size:12px;line-height:1.7}.panel{background:#fff;border:1px solid #dbe8f5;border-radius:14px;padding:20px;margin:16px 0}.login{max-width:480px;margin:40px auto}.input{width:100%;box-sizing:border-box;border:1px solid #c9d9e8;border-radius:8px;padding:11px;font-size:13px;margin-top:6px}.label{font-size:11px;font-weight:800;color:#315677;display:block;margin-top:12px}.btn{border:0;border-radius:8px;padding:10px 15px;background:#0878e8;color:#fff;font-weight:800;cursor:pointer}.btn.gray{background:#eef5fc;color:#315677}.btn.red{background:#fff0f0;color:#b32626;border:1px solid #f0caca}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.msg{padding:10px;border-radius:8px;margin-top:10px;font-size:12px}.ok{background:#edf9f1;color:#21733b}.err{background:#fff2f2;color:#a32626}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar .input{margin:0;flex:1;min-width:220px}table{width:100%;border-collapse:collapse;font-size:11px;margin-top:12px}th,td{padding:9px 7px;border-bottom:1px solid #e6eef6;text-align:left;vertical-align:top}th{background:#f8fbfe;color:#52708d}.mono{font-family:Consolas,monospace;color:#0874d8;font-weight:900}.count{font-size:11px;color:#60758f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.hidden{display:none!important}.userbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:#60758f}.log{max-height:430px;overflow:auto}.tag{display:inline-block;padding:3px 7px;border-radius:6px;background:#eef5fc;font-weight:800;font-size:10px}.tag.add{background:#edf9f1;color:#21733b}.tag.edit{color:#145c9f}.tag.del{background:#fff0f0;color:#a32626}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}table{display:block;overflow:auto;white-space:nowrap}}</style></head><body><header class="nav"><a href="index.html">RICOH Smart Hub</a><a href="parts.html">← 回零件資料庫</a></header><main class="wrap"><div class="title">工程零件資料庫管理</div><div class="sub">管理員登入後，才能新增、修改、刪除及備份零件資料。</div><section id="loginPanel" class="panel login"><h3>管理員登入</h3><div class="label">帳號</div><input id="email" class="input" value="admin" autocomplete="username"><div class="label">密碼</div><input id="password" class="input" type="password" autocomplete="current-password"><div class="actions"><button id="login" class="btn">登入</button></div><div id="loginMsg"></div><div class="sub" style="margin-top:12px">管理員帳號：admin｜不開放自行註冊</div></section><section id="adminPanel" class="hidden"><section class="panel"><div class="userbar"><span id="userInfo"></span><button id="logout" class="btn gray">登出</button></div></section><section class="panel"><h3 id="formTitle">新增零件</h3><div class="grid"><div><div class="label">料號 *</div><input id="partsNo" class="input" placeholder="例如 D0BK2205"></div><div><div class="label">零件名稱</div><input id="name" class="input"></div><div class="full"><div class="label">適用機型</div><input id="models" class="input" placeholder="例如 IM C3000；IM C3500"></div><div><div class="label">名稱狀態</div><input id="status" class="input"></div><div><div class="label">原始名稱</div><input id="originalNames" class="input"></div></div><div class="actions"><button id="save" class="btn">儲存</button><button id="cancel" class="btn gray hidden">取消編輯</button></div><div id="msg"></div></section><section class="panel"><div class="toolbar"><input id="search" class="input" placeholder="搜尋料號、名稱或機型"><span id="count" class="count"></span><button id="reload" class="btn gray">重新整理</button></div><div id="list"><div class="sub" style="padding:20px">正在載入…</div></div></section><section class="panel"><h3>CSV 備份／匯入</h3><div class="sub">匯出全部雲端資料；CSV 可再次匯入，相同料號會更新。</div><div class="actions"><button id="export" class="btn">📥 匯出全部 CSV</button><input id="csv" type="file" accept=".csv,text/csv" class="input" style="max-width:320px"><button id="import" class="btn gray">📤 匯入 CSV</button></div><div id="csvMsg"></div></section><section class="panel"><div class="toolbar"><div><h3 style="margin:0">修改紀錄</h3><div class="sub">最近 100 筆新增、修改、刪除紀錄。</div></div><button id="refreshLog" class="btn gray">重新整理</button></div><div id="auditList" class="log"><div class="sub" style="padding:20px">正在載入紀錄…</div></div></section></section></main><script>const SUPABASE_URL='https://ppzdwearxmxrkqgcphvt.supabase.co',SUPABASE_KEY='sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb',ADMIN_EMAIL='willie.lee@ricoh.com.tw',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let ALL=[],editId=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function show(id,t,e=false){$(id).innerHTML=t?'<div class="msg '+(e?'err':'ok')+'">'+esc(t)+'</div>':''}async function getSession(){return (await db.auth.getSession()).data.session}function variants(s){const out=[];for(const g of String(s||'').toUpperCase().split(/[;；、,\n]+/)){const t=g.trim();if(!t)continue;const m=t.match(/^(.*?)(\d+(?:\s*\/\s*\d+)*)$/);if(m){const p=m[1].replace(/[^A-Z]/g,'');(m[2].match(/\d+/g)||[]).forEach(n=>{out.push(n);if(p)out.push(p+n)})}out.push(t.replace(/[^A-Z0-9]/g,''))}return [...new Set(out)]}function hitModel(models,q){const x=String(q||'').toUpperCase().replace(/[^A-Z0-9]/g,'');return variants(models).some(v=>v===x)}async function load(){const r=await db.from('parts').select('*').order('parts_no');if(r.error){show('msg','資料載入失敗：'+r.error.message,true);return}ALL=r.data||[];render()}function render(){const q=$('search').value.trim(),u=q.toUpperCase();const rows=ALL.filter(x=>!q||hitModel(x.models,q)||[x.parts_no,x.name,x.original_names,x.status].join(' ').toUpperCase().includes(u));$('count').textContent=rows.length+' 筆';if(!rows.length){$('list').innerHTML='<div class="sub" style="padding:25px">沒有符合資料</div>';return}$('list').innerHTML='<table><thead><tr><th>料號</th><th>名稱</th><th>適用機型</th><th>操作</th></tr></thead><tbody>'+rows.map(x=>'<tr><td class="mono">'+esc(x.parts_no)+'</td><td>'+esc(x.name||'')+'<br><span class="sub">'+esc(x.original_names||'')+'</span></td><td>'+esc(x.models||'')+'</td><td><button class="btn gray" onclick="editPart('+x.id+')">修改</button> <button class="btn red" onclick="delPart('+x.id+')">刪除</button></td></tr>').join('')+'</tbody></table>'}function clearForm(){editId=null;$('formTitle').textContent='新增零件';['partsNo','name','models','status','originalNames'].forEach(id=>$(id).value='');$('cancel').classList.add('hidden')}window.editPart=id=>{const x=ALL.find(v=>v.id===id);if(!x)return;editId=id;$('formTitle').textContent='修改零件';$('partsNo').value=x.parts_no||'';$('name').value=x.name||'';$('models').value=x.models||'';$('status').value=x.status||'';$('originalNames').value=x.original_names||'';$('cancel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})};window.delPart=async id=>{const x=ALL.find(v=>v.id===id);if(!x||!confirm('確定刪除 '+x.parts_no+'？'))return;const r=await db.from('parts').delete().eq('id',id);if(r.error){show('msg','刪除失敗：'+r.error.message,true);return}show('msg','已刪除 '+x.parts_no);await load();await loadAudit()};$('save').onclick=async()=>{const parts_no=$('partsNo').value.trim();if(!parts_no){show('msg','請輸入料號。',true);return}const row={parts_no,name:$('name').value.trim(),models:$('models').value.trim(),status:$('status').value.trim(),original_names:$('originalNames').value.trim(),updated_at:new Date().toISOString()};const r=editId?await db.from('parts').update(row).eq('id',editId):await db.from('parts').insert(row);if(r.error){show('msg','儲存失敗：'+r.error.message+(r.error.code==='23505'?'（料號已存在）':''),true);return}show('msg',editId?'已更新 '+parts_no:'已新增 '+parts_no);clearForm();await load();await loadAudit()};$('cancel').onclick=clearForm;$('search').oninput=render;$('reload').onclick=load;$('login').onclick=async()=>{show('loginMsg','');let account=$('email').value.trim();if(account.toLowerCase()==='admin')account=ADMIN_EMAIL;const password=$('password').value;if(!password){show('loginMsg','請輸入密碼。',true);return}const r=await db.auth.signInWithPassword({email:account,password});if(r.error){show('loginMsg','登入失敗：'+r.error.message,true);return}await init()};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};function cell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}$('export').onclick=async()=>{if(!await getSession()){show('csvMsg','請先登入。',true);return}const r=await db.from('parts').select('*').order('parts_no');if(r.error){show('csvMsg','備份失敗：'+r.error.message,true);return}const h=['料號','零件名稱','適用機型','名稱狀態','原始名稱','建立時間','最後更新時間'];const b=(r.data||[]).map(x=>[x.parts_no,x.name,x.models,x.status,x.original_names,x.created_at,x.updated_at].map(cell).join(','));const blob=new Blob(['\uFEFF'+[h.map(cell).join(','),...b].join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RICOH_Parts_Backup_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href);show('csvMsg','備份完成，共 '+(r.data||[]).length+' 筆')};function parseCSV(s){const rows=[];let row=[],c='',q=false;for(let i=0;i<s.length;i++){const x=s[i];if(x==='"'){if(q&&s[i+1]==='"'){c+='"';i++}else q=!q}else if(x===','&&!q){row.push(c);c=''}else if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&s[i+1]==='\n')i++;row.push(c);if(row.some(v=>v.trim()))rows.push(row);row=[];c=''}else c+=x}if(c||row.length){row.push(c);if(row.some(v=>v.trim()))rows.push(row)}return rows}$('import').onclick=async()=>{if(!await getSession()){show('csvMsg','請先登入。',true);return}const f=$('csv').files[0];if(!f){show('csvMsg','請先選擇 CSV。',true);return}try{const buf=await f.arrayBuffer();let text=new TextDecoder('utf-8').decode(buf);if(text.includes('�'))text=new TextDecoder('big5').decode(buf);const rows=parseCSV(text),h=rows[0].map(x=>x.trim().replace(/^\uFEFF/,''));const idx=(...ns)=>{for(const n of ns){const i=h.indexOf(n);if(i>=0)return i}return -1};const ip=idx('料號','parts_no'),inm=idx('零件名稱','名稱','name'),im=idx('適用機型','機型','models'),is=idx('名稱狀態','status'),io=idx('原始名稱','original_names');if(ip<0)throw Error('找不到「料號」欄位');const data=rows.slice(1).map(a=>({parts_no:(a[ip]||'').trim(),name:inm>=0?(a[inm]||'').trim():'',models:im>=0?(a[im]||'').trim():'',status:is>=0?(a[is]||'').trim():'',original_names:io>=0?(a[io]||'').trim():''})).filter(x=>x.parts_no);if(!data.length)throw Error('沒有有效料號');if(!confirm('準備匯入 '+data.length+' 筆，相同料號會更新。確定？'))return;for(let i=0;i<data.length;i+=50){const r=await db.from('parts').upsert(data.slice(i,i+50),{onConflict:'parts_no'});if(r.error)throw r.error}show('csvMsg','匯入完成，共 '+data.length+' 筆');$('csv').value='';await load();await loadAudit()}catch(e){show('csvMsg','匯入失敗：'+e.message,true)}};async function loadAudit(){const r=await db.from('parts_audit_log').select('id,created_at,action,parts_no,old_data,new_data').order('created_at',{ascending:false}).limit(100);if(r.error){$('auditList').innerHTML='<div class="sub" style="padding:20px">修改紀錄載入失敗：'+esc(r.error.message)+'</div>';return}if(!r.data?.length){$('auditList').innerHTML='<div class="sub" style="padding:20px">目前還沒有修改紀錄。</div>';return}$('auditList').innerHTML='<table><thead><tr><th>時間</th><th>動作</th><th>料號</th><th>變更內容</th></tr></thead><tbody>'+r.data.map(x=>{const old=x.old_data?[x.old_data.parts_no,x.old_data.name,x.old_data.models].filter(Boolean).join('｜'):'';const nw=x.new_data?[x.new_data.parts_no,x.new_data.name,x.new_data.models].filter(Boolean).join('｜'):'';const d=x.action==='修改'?old+' → '+nw:x.action==='新增'?nw:old;return '<tr><td>'+esc(new Date(x.created_at).toLocaleString('zh-TW'))+'</td><td>'+esc(x.action||'')+'</td><td class="mono">'+esc(x.parts_no||'')+'</td><td>'+esc(d)+'</td></tr>'}).join('')+'</tbody></table>'}$('refreshLog').onclick=loadAudit;async function init(){const s=await getSession();if(!s){$('loginPanel').classList.remove('hidden');$('adminPanel').classList.add('hidden');return}if((s.user.email||'').toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await db.auth.signOut();show('loginMsg','此帳號不是管理員。',true);return}$('loginPanel').classList.add('hidden');$('adminPanel').classList.remove('hidden');$('userInfo').textContent='管理員：'+s.user.email;await load();await loadAudit()}init();</script></body></html>
