<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>維修案例｜RICOH Smart Hub</title><style>body{margin:0;background:#f4f8fc;color:#173456;font-family:"Noto Sans TC",Arial,sans-serif}.top{padding:17px 5%;background:#08295d;color:#fff;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:1180px;margin:auto;padding:30px 20px}.hero,.card,.filter{background:#fff;border:1px solid #dbe8f5;border-radius:14px}.hero{padding:24px;background:linear-gradient(120deg,#fff,#eaf6ff)}h1{margin:4px 0;color:#08295d}.sub{font-size:12px;color:#60758f}.filter{margin-top:14px;padding:14px;display:flex;gap:9px}.filter input,.filter select{flex:1;padding:11px;border:1px solid #cbdceb;border-radius:8px}.grid{display:grid;gap:13px;margin-top:16px}.card{padding:19px}.meta{font-size:10px;color:#0878e8;font-weight:900}.card h2{font-size:17px;margin:5px 0}.label{font-size:10px;font-weight:900;color:#52708d;margin-top:10px}.text{font-size:12px;line-height:1.75}.link{font-size:11px;color:#0878e8;font-weight:800;margin-right:12px}.fav{float:right;border:1px solid #dbe8f5;background:#fff;border-radius:7px;padding:5px 8px}.empty{background:#fff;border:1px dashed #cbdceb;border-radius:12px;padding:40px;text-align:center}@media(max-width:700px){.filter{flex-direction:column}}</style></head><body><header class="top"><a href="index.html">RICOH Smart Hub</a><a href="cases-admin.html">⚙ 管理案例</a></header><main class="wrap"><section class="hero"><div class="meta">SERVICE CASE LIBRARY</div><h1>維修案例</h1><div class="sub">把實際處理過的問題留下來，下次遇到同樣症狀直接查。</div></section><section class="filter"><input id="q" placeholder="搜尋機型、機號、SC、症狀、料號…"><select id="model"><option value="">全部機型</option></select></section><div id="out" class="grid"><div class="empty">正在載入…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ppzdwearxmxrkqgcphvt.supabase.co','sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb');let DATA=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const r=await db.from('repair_cases').select('*').eq('status','published').order('created_at',{ascending:false});if(r.error){$('out').innerHTML='<div class="empty">載入失敗：'+esc(r.error.message)+'</div>';return}DATA=r.data||[];const ms=[...new Set(DATA.map(x=>x.model).filter(Boolean))].sort();$('model').innerHTML='<option value="">全部機型</option>'+ms.map(x=>'<option>'+esc(x)+'</option>').join('');render()}function render(){const q=$('q').value.trim().toUpperCase(),m=$('model').value;const a=DATA.filter(x=>(!m||x.model===m)&&(!q||[x.title,x.model,x.machine_no,x.sc_code,x.symptoms,x.cause,x.solution,x.parts_no,x.source].join(' ').toUpperCase().includes(q)));if(!a.length){$('out').innerHTML='<div class="empty">目前沒有符合的維修案例。<br>也可以從問題回報新增案例。</div>';return}$('out').innerHTML=a.map(x=>'<article class="card" id="case-'+x.id+'"><button class="fav" data-key="case:'+x.id+'" data-name="'+esc(x.title)+'" data-url="cases.html#case-'+x.id+'">☆</button><div class="meta">'+esc(x.model||'未指定')+(x.machine_no?' ｜ 機號 '+esc(x.machine_no):'')+(x.sc_code?' ｜ '+esc(x.sc_code):'')+(x.case_date?' ｜ '+esc(x.case_date):'')+'</div><h2>'+esc(x.title)+'</h2>'+(x.symptoms?'<div class="label">故障症狀</div><div class="text">'+esc(x.symptoms)+'</div>':'')+(x.cause?'<div class="label">主要原因</div><div class="text">'+esc(x.cause)+'</div>':'')+(x.solution?'<div class="label">處理方式</div><div class="text">'+esc(x.solution)+'</div>':'')+(x.parts_no?'<div class="label">相關料號</div><div class="text">'+esc(x.parts_no)+'</div>':'')+'<div style="margin-top:12px">'+(x.sc_code?'<a class="link" href="sc.html?q='+encodeURIComponent(x.sc_code)+'">查 SC →</a>':'')+(x.parts_no?'<a class="link" href="search.html?q='+encodeURIComponent(x.parts_no)+'">查料號 →</a>':'')+(x.machine_no?'<a class="link" href="machine.html?machine='+encodeURIComponent(x.machine_no)+'">看機號履歷 →</a>':'')+'</div>'+(x.source?'<div class="label">資料來源</div><div class="text">'+esc(x.source)+'</div>':'')+'</article>').join('');document.querySelectorAll('.fav').forEach(b=>{b.textContent=window.ricohIsFavorite?.(b.dataset.key)?'★':'☆';b.onclick=()=>{const on=window.ricohFavorite({key:b.dataset.key,title:b.dataset.name,url:b.dataset.url});b.textContent=on?'★':'☆'}})}$('q').oninput=render;$('model').onchange=render;load()</script><script src="analytics.js"></script></body></html>
