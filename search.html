<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工程資料搜尋｜RICOH Smart Hub</title><style>body{margin:0;background:#f4f8fc;color:#173456;font-family:"Noto Sans TC",Arial,sans-serif}.top{padding:18px 5%;background:#08295d;color:#fff;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:1200px;margin:auto;padding:30px 20px}.hero,.bar,.card{background:#fff;border:1px solid #dbe8f5;border-radius:14px}.hero{padding:24px;background:linear-gradient(120deg,#fff,#eaf6ff)}.hero h1{margin:4px 0;color:#08295d}.sub{color:#60758f;font-size:12px}.bar{margin-top:14px;padding:14px;display:flex;gap:9px}.bar input{flex:1;padding:14px;border:2px solid #cbdceb;border-radius:9px;font-size:15px}.bar button{border:0;border-radius:9px;background:#0878e8;color:#fff;font-weight:800;padding:0 18px}.stats{margin:14px 0;font-size:12px;color:#60758f}.group{margin-top:16px}.group h2{font-size:18px;color:#08295d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:16px;position:relative}.type{font-size:10px;font-weight:900;color:#0878e8}.name{font-size:16px;font-weight:900;margin:5px 0}.desc{font-size:11px;color:#60758f;line-height:1.7}.open{display:inline-block;margin-top:10px;color:#0878e8;font-weight:800;font-size:11px}.fav{position:absolute;right:12px;top:12px;border:1px solid #dbe8f5;background:#fff;border-radius:7px;padding:5px 8px;cursor:pointer}.empty{background:#fff;border:1px dashed #cbdceb;padding:40px;text-align:center;border-radius:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.bar{flex-direction:column}.bar button{height:42px}}</style></head><body><header class="top"><a href="index.html">RICOH Smart Hub</a><a href="favorites.html">★ 我的收藏</a></header><main class="wrap"><section class="hero"><div style="font-size:10px;color:#0878e8;font-weight:900;letter-spacing:.15em">ENGINEERING SEARCH</div><h1>工程資料搜尋</h1><div class="sub">SC Code、零件、工程手冊、維修案例、機器履歷一次搜尋。</div></section><div class="bar"><input id="q" type="search" placeholder="輸入 SC541、D0BK2205、IM C3000、機號、定著…"><button id="go">搜尋</button></div><div id="stats" class="stats"></div><div id="out"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ppzdwearxmxrkqgcphvt.supabase.co','sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),n=s=>String(s??'').toUpperCase().replace(/\s+/g,'');function modelMatches(models,needle){return n(models).split(/[;|,]+/).map(x=>x.trim()).filter(Boolean).some(x=>x.includes(needle))}function matchingModels(models,needle){return String(models??'').split(/[;|,]+/).map(x=>x.trim()).filter(Boolean).filter(x=>n(x).includes(needle)).join('、')}async function search(){const q=$('q').value.trim();if(!q){$('stats').textContent='請輸入搜尋內容';$('out').innerHTML='';return}const needle=n(q);const modelQuery=/^\d{1,4}$/.test(q)||/^IM\s*C?\d+/i.test(q)||/^(MP|MPC|SP|IMC)\s*[A-Z]?\d+/i.test(q);$('out').innerHTML='<div class="empty">搜尋中…</div>';const [p,m,s,c,h,v]=await Promise.all([db.from('parts').select('id,parts_no,name,models').limit(5000),db.from('manuals').select('id,model,title,version,file_path').limit(500),db.from('sc_manual_primary').select('*').limit(3000),db.from('repair_cases').select('*').eq('status','published').limit(1000),db.from('machine_history').select('*').limit(2000),db.from('data_versions').select('*').limit(500)]);const hits=[];for(const x of p.data||[]){const fields=[x.parts_no,x.name,x.models].join(' ');const ok=modelQuery?modelMatches(x.models,needle):n(fields).includes(needle);if(ok)hits.push({type:'零件',name:x.parts_no+'｜'+(x.name||''),desc:modelQuery?matchingModels(x.models,needle):(x.models||''),url:'parts.html?q='+encodeURIComponent(x.parts_no),key:'part:'+x.parts_no})}for(const x of m.data||[])if((modelQuery?n(x.model).includes(needle):n([x.model,x.title,x.version,x.file_path].join(' ')).includes(needle)))hits.push({type:'手冊',name:(x.model||'')+'｜'+(x.title||''),desc:'版本 '+(x.version||''),url:'manuals.html?q='+encodeURIComponent(x.model||x.title||''),key:'manual:'+x.id});for(const x of s.data||[])if(n([x.sc_code,x.error_zh,x.error_en,x.condition_zh,x.condition_en,x.cause_zh,x.cause_en,x.solution_zh,x.solution_en,x.series].join(' ')).includes(needle))hits.push({type:'SC Code',name:x.sc_code+'｜'+(x.error_zh||x.error_en||''),desc:x.series||'',url:'sc.html?q='+encodeURIComponent(x.sc_code),key:'sc:'+x.sc_code});for(const x of c.data||[])if((modelQuery?n(x.model).includes(needle):n([x.title,x.model,x.sc_code,x.symptoms,x.cause,x.solution,x.parts_no,x.machine_no,x.source].join(' ')).includes(needle)))hits.push({type:'維修案例',name:x.title,desc:[modelQuery?x.model:[x.model,x.machine_no,x.sc_code,x.parts_no].filter(Boolean).join('｜')].filter(Boolean).join(''),url:'cases.html#case-'+x.id,key:'case:'+x.id});for(const x of h.data||[])if((modelQuery?n(x.model).includes(needle):n([x.machine_no,x.model,x.customer,x.sc_code,x.issue,x.solution,x.parts_no,x.engineer].join(' ')).includes(needle)))hits.push({type:'機器履歷',name:(x.machine_no||'未指定機號')+'｜'+(x.sc_code||'一般維修'),desc:[x.model,x.customer,x.issue].filter(Boolean).join('｜'),url:'machine.html?machine='+encodeURIComponent(x.machine_no||''),key:'history:'+x.id});for(const x of v.data||[])if(!modelQuery&&n([x.data_type,x.version,x.note,x.updated_by].join(' ')).includes(needle))hits.push({type:'資料版本',name:x.data_type+'｜'+x.version,desc:x.note||'',url:'versions.html',key:'version:'+x.id});$('stats').textContent='找到 '+hits.length+' 筆資料';if(!hits.length){$('out').innerHTML='<div class="empty">找不到資料。<br>已記錄這次無結果搜尋，之後可用來補資料。</div>';window.ricohTrack?.('no_result_search',q);return}const groups={};hits.forEach(x=>(groups[x.type]??=[]).push(x));$('out').innerHTML=Object.entries(groups).map(([type,arr])=>'<section class="group"><h2>'+type+'（'+arr.length+'）</h2><div class="grid">'+arr.slice(0,100).map(x=>'<article class="card"><button class="fav" data-key="'+esc(x.key)+'" data-name="'+esc(x.name)+'" data-url="'+esc(x.url)+'">☆ 收藏</button><div class="type">'+x.type+'</div><div class="name">'+esc(x.name)+'</div><div class="desc">'+esc(x.desc)+'</div><a class="open" href="'+x.url+'">查看 →</a></article>').join('')+'</div></section>').join('');document.querySelectorAll('.fav').forEach(b=>{b.textContent=window.ricohIsFavorite?.(b.dataset.key)?'★ 已收藏':'☆ 收藏';b.onclick=()=>{const on=window.ricohFavorite({key:b.dataset.key,title:b.dataset.name,url:b.dataset.url});b.textContent=on?'★ 已收藏':'☆ 收藏'}})}$('go').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter')search()};</script><script src="analytics.js"></script></body></html>
