<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>網站使用統計｜RICOH Smart Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--blue:#0878e8;--navy:#08295d;--ink:#173456;--sub:#60758f;--line:#dbe8f5;--bg:#f5f9fd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",Arial,sans-serif}.nav{height:64px;background:linear-gradient(100deg,#061d46,#0a4f9e 58%,#087bdc);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,5%)}.brand{font-weight:900;font-size:20px}.back{color:#fff;text-decoration:none;font-size:12px;font-weight:800}.wrap{max-width:1200px;margin:auto;padding:34px 20px 70px}.kicker{font-size:10px;font-weight:900;letter-spacing:.15em;color:var(--blue)}.title{font-size:32px;font-weight:900;color:#0b2d59;margin:5px 0}.desc{font-size:12px;color:var(--sub)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}.login{max-width:440px;margin:35px auto}.label{font-size:12px;font-weight:800;color:#315677;display:block;margin-top:12px}.input{width:100%;border:1px solid #c9d9e8;border-radius:9px;padding:12px;font-size:14px;margin-top:7px}.btn{border:0;border-radius:9px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#eef5fc;color:#315677}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.msg{margin-top:12px;padding:10px;border-radius:8px;font-size:12px}.err{background:#fff1f1;color:#a32626}.ok{background:#edf9f1;color:#21733b}.hidden{display:none!important}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.metric .lab{font-size:11px;color:var(--sub)}.metric .num{font-size:30px;font-weight:900;color:#0b2d59;margin-top:5px}.metric .note{font-size:10px;color:#7b8da3;margin-top:3px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chart{min-height:280px}.bars{display:flex;align-items:end;gap:7px;height:210px;padding:20px 4px 0;border-bottom:1px solid #dfeaf4}.bar{flex:1;min-width:8px;background:#0878e8;border-radius:5px 5px 0 0;position:relative}.bar span{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);font-size:9px;color:#71849b;white-space:nowrap}.bar b{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:9px;color:#315677}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr 80px 80px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #edf2f7;font-size:12px}.row:last-child{border-bottom:0}.rank{font-weight:900;color:#0b2d59}.numsmall{text-align:right;font-weight:900;color:#0874d8}.recent{max-height:360px;overflow:auto}.recent .row{grid-template-columns:110px 1fr 90px}.muted{font-size:10px;color:#7b8da3}.empty{text-align:center;color:var(--sub);padding:25px}.period{font-size:11px;color:var(--sub)}@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}@media(max-width:520px){.cards{grid-template-columns:1fr}.title{font-size:27px}.nav{padding:0 16px}.brand{font-size:17px}}
</style></head><body><header class="nav"><div class="brand">RICOH Smart Hub｜使用統計</div><a class="back" href="index.html">← 回 Smart Hub</a></header><main class="wrap"><section id="loginPanel" class="panel login"><div class="kicker">PRIVATE ADMIN</div><h1 class="title">網站使用統計</h1><p class="desc">只有管理員可以查看統計資料。</p><label class="label">帳號</label><input id="email" class="input" value="admin" autocomplete="username"><label class="label">密碼</label><input id="password" class="input" type="password" autocomplete="current-password"><div class="actions"><button id="login" class="btn">登入查看</button></div><div id="loginMsg"></div></section><section id="dashboard" class="hidden"><div class="topbar"><div><div class="kicker">PRIVATE ADMIN DASHBOARD</div><h1 class="title">網站使用統計</h1><div class="desc">統計最近 30 天的使用情況；不記錄 IP。</div></div><div class="actions"><button id="refresh" class="btn secondary">重新整理</button><button id="logout" class="btn secondary">登出</button></div></div><div class="panel"><div class="period">統計期間：<span id="period"></span></div></div><div class="cards"><div class="metric"><div class="lab">今日使用人數</div><div class="num" id="todayUsers">—</div><div class="note">依瀏覽器訪客識別</div></div><div class="metric"><div class="lab">今日瀏覽次數</div><div class="num" id="todayViews">—</div><div class="note">頁面開啟</div></div><div class="metric"><div class="lab">今日操作次數</div><div class="num" id="todayActions">—</div><div class="note">按鈕／連結等</div></div><div class="metric"><div class="lab">30 天使用人數</div><div class="num" id="monthUsers">—</div><div class="note">不重複訪客</div></div></div><div class="cols"><section class="panel chart"><h3>每日使用人數</h3><div id="dailyChart" class="bars"></div></section><section class="panel"><h3>最常使用功能</h3><div id="pages" class="list"></div></section></div><section class="panel"><h3>最近使用紀錄</h3><div id="recent" class="recent"></div></section></section></main><script>const SUPABASE_URL='https://ppzdwearxmxrkqgcphvt.supabase.co',SUPABASE_KEY='sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb',ADMIN_EMAIL='willie.lee@ricoh.com.tw';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function msg(t,e=false){$('loginMsg').innerHTML=t?'<div class="msg '+(e?'err':'ok')+'">'+esc(t)+'</div>':''}async function getSession(){return(await db.auth.getSession()).data.session}async function init(){const s=await getSession();if(!s){$('loginPanel').classList.remove('hidden');$('dashboard').classList.add('hidden');return}if((s.user.email||'').toLowerCase()!==ADMIN_EMAIL){await db.auth.signOut();msg('此帳號不是管理員。',true);return}$('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');await load()}$('login').onclick=async()=>{msg('');let account=$('email').value.trim();if(account.toLowerCase()==='admin')account=ADMIN_EMAIL;const password=$('password').value;if(!password)return msg('請輸入密碼。',true);const {error}=await db.auth.signInWithPassword({email:account,password});if(error)return msg('登入失敗：'+error.message,true);await init()};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('refresh').onclick=load;function dayKey(d){const x=new Date(d);return x.toLocaleDateString('sv-SE',{timeZone:'Asia/Taipei'})}function fmt(d){return new Date(d).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false})}function pageName(p){return ({'index.html':'首頁','parts.html':'零件資料庫','manuals.html':'工程手冊','sc.html':'SC Error','qr.html':'QR Code','parts-admin.html':'零件管理','usage-admin.html':'使用統計'})[p]||p}async function load(){const now=new Date(),from=new Date(now.getTime()-30*86400000).toISOString();$('period').textContent=dayKey(from)+' ～ '+dayKey(now);const {data,error}=await db.from('usage_events').select('created_at,page,page_title,action,target,session_id').gte('created_at',from).order('created_at',{ascending:false}).limit(10000);if(error){$('recent').innerHTML='<div class="msg err">資料讀取失敗：'+esc(error.message)+'</div>';return}const rows=data||[],today=dayKey(now),views=rows.filter(x=>x.action==='view'),todayViews=views.filter(x=>dayKey(x.created_at)===today),todayAll=rows.filter(x=>dayKey(x.created_at)===today);$('todayUsers').textContent=new Set(todayAll.map(x=>x.session_id).filter(Boolean)).size;$('todayViews').textContent=todayViews.length;$('todayActions').textContent=todayAll.filter(x=>x.action!=='view').length;$('monthUsers').textContent=new Set(rows.map(x=>x.session_id).filter(Boolean)).size;const daily={};const dailyUsers={};for(let i=29;i>=0;i--){const d=new Date(now.getTime()-i*86400000),k=dayKey(d);daily[k]=0;dailyUsers[k]=new Set()}views.forEach(x=>{const k=dayKey(x.created_at);if(daily[k]!==undefined){daily[k]++;dailyUsers[k].add(x.session_id)}});const keys=Object.keys(daily),max=Math.max(1,...keys.map(k=>dailyUsers[k].size));$('dailyChart').innerHTML=keys.map(k=>{const n=dailyUsers[k].size,h=Math.max(4,n/max*180);return '<div class="bar" style="height:'+h+'px" title="'+k+'：'+n+' 人"><b>'+n+'</b><span>'+k.slice(5)+'</span></div>'}).join('');const pc={};views.forEach(x=>{pc[x.page]=(pc[x.page]||0)+1});const top=Object.entries(pc).sort((a,b)=>b[1]-a[1]).slice(0,10);$('pages').innerHTML=top.length?top.map((x,i)=>'<div class="row"><div><span class="rank">#'+(i+1)+'</span> '+esc(pageName(x[0]))+'<div class="muted">'+esc(x[0])+'</div></div><div class="numsmall">'+x[1]+'</div><div class="muted">次瀏覽</div></div>').join(''):'<div class="empty">目前沒有資料</div>';$('recent').innerHTML=rows.slice(0,100).map(x=>'<div class="row"><div class="muted">'+fmt(x.created_at)+'</div><div><strong>'+esc(pageName(x.page))+'</strong><div class="muted">'+esc(x.action)+(x.target?'｜'+esc(x.target):'')+'</div></div><div class="muted">'+esc(x.session_id?x.session_id.slice(0,8):'—')+'</div></div>').join('')||'<div class="empty">目前沒有資料</div>'}init();</script></body></html>
