<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 工程助理｜RICOH Smart Hub</title><style>body{margin:0;background:#f4f8fc;color:#173456;font-family:"Noto Sans TC",Arial,sans-serif}.top{padding:17px 5%;background:linear-gradient(100deg,#061d46,#0a4f9e);color:#fff;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:1000px;margin:auto;padding:30px 20px}.hero,.chat,.result{background:#fff;border:1px solid #dbe8f5;border-radius:14px}.hero{padding:24px;background:linear-gradient(120deg,#fff,#eaf6ff)}h1{margin:4px 0;color:#08295d}.sub{font-size:12px;color:#60758f}.chat{margin-top:14px;padding:14px;display:flex;gap:8px}.chat input{flex:1;padding:13px;border:2px solid #cbdceb;border-radius:9px}.chat button{border:0;background:#0878e8;color:#fff;border-radius:9px;padding:0 18px;font-weight:900}.result{margin-top:14px;padding:20px}.answer{background:#f4f9fe;border-radius:10px;padding:15px;line-height:1.8;font-size:13px}.card{padding:12px;border-bottom:1px solid #e6eef6}.type{font-size:10px;color:#0878e8;font-weight:900}.card a{color:#0878e8;font-weight:800;font-size:11px}.warn{font-size:10px;color:#8a6a00;background:#fff8dd;padding:9px;border-radius:7px;margin-top:12px}</style></head><body><header class="top"><a href="index.html">RICOH Smart Hub</a><a href="favorites.html">★ 我的收藏</a></header><main class="wrap"><section class="hero"><div style="font-size:10px;font-weight:900;color:#0878e8;letter-spacing:.15em">AI ENGINEERING ASSISTANT</div><h1>AI 工程助理</h1><div class="sub">先用 Smart Hub 的 SC、零件、手冊與案例資料做交叉判斷；資料越完整，回答越準。</div></section><div class="chat"><input id="q" placeholder="例如：IM C3000 出現 SC541-01 要先查什麼？"><button id="go">分析</button></div><section id="out" class="result"><div class="sub">輸入問題後，助理會先搜尋工程資料，再整理可能相關的資料。</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ppzdwearxmxrkqgcphvt.supabase.co','sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function n(s){return String(s??'').toUpperCase().replace(/\s+/g,'')}function extractSC(q){const m=q.toUpperCase().match(/SC\s*\d{3}(?:-\d{1,2})?/);return m?m[0].replace(/\s+/g,''):''}async function ask(){const q=$('q').value.trim();if(!q)return;const sc=extractSC(q),needle=n(q);$('out').innerHTML='<div class="sub">正在查詢 SC、零件、案例與手冊…</div>';const [s,p,c,m]=await Promise.all([db.from('sc_manual_primary').select('*').limit(3000),db.from('parts').select('parts_no,name,models').limit(5000),db.from('repair_cases').select('*').eq('status','published').limit(1000),db.from('manuals').select('*').limit(500)]);let sh=(s.data||[]).filter(x=>sc?n(x.sc_code)===n(sc):n([x.error_zh,x.error_en,x.condition_zh,x.condition_en,x.cause_zh,x.cause_en,x.solution_zh,x.solution_en,x.series].join(' ')).includes(needle));if(!sh.length&&sc)sh=(s.data||[]).filter(x=>n(x.sc_code).startsWith(n(sc).split('-')[0]));let ch=(c.data||[]).filter(x=>n([x.title,x.model,x.sc_code,x.symptoms,x.cause,x.solution,x.parts_no].join(' ')).includes(needle)||sc&&n(x.sc_code)===n(sc));let ph=(p.data||[]).filter(x=>n([x.parts_no,x.name,x.models].join(' ')).includes(needle)).slice(0,30);let mh=(m.data||[]).filter(x=>n([x.model,x.title,x.version].join(' ')).includes(needle)).slice(0,10);let answer='';if(sh.length){const x=sh[0];answer+='最相關的 SC：<b>'+esc(x.sc_code)+'</b>。'+esc(x.error_zh||x.error_en||'')+'。 ';if(x.cause_zh||x.cause_en)answer+='主要原因：'+esc(x.cause_zh||x.cause_en)+'。 ';if(x.solution_zh||x.solution_en)answer+='建議處置：'+esc(x.solution_zh||x.solution_en)+'。 '}if(ch.length)answer+='另外找到 '+ch.length+' 筆維修案例，可優先參考。 ';if(ph.length)answer+='找到 '+ph.length+' 筆可能相關零件。 ';if(mh.length)answer+='找到 '+mh.length+' 筆相關手冊。 ';if(!answer)answer='目前資料庫沒有足夠資料直接回答，建議改用 SC Code、料號或完整機型搜尋。';$('out').innerHTML='<div class="answer">'+answer+'</div><div class="warn">⚠ 這一版是「資料庫型 AI 助理」：回答只根據 Smart Hub 目前的結構化資料，不會假裝知道資料庫沒有的內容。遇到高風險維修判斷仍以原廠 Service Manual 為第一優先。</div>'+(sh.length?'<h3>SC 資料</h3>'+sh.slice(0,5).map(x=>'<div class="card"><div class="type">SC CODE</div><b>'+esc(x.sc_code)+'</b>｜'+esc(x.error_zh||x.error_en||'')+'<br><a href="sc.html?q='+encodeURIComponent(x.sc_code)+'">查看 SC →</a></div>').join(''):'')+(ch.length?'<h3>維修案例</h3>'+ch.slice(0,5).map(x=>'<div class="card"><div class="type">CASE</div><b>'+esc(x.title)+'</b><br><a href="cases.html#case-'+x.id+'">查看案例 →</a></div>').join(''):'')+(ph.length?'<h3>相關零件</h3>'+ph.slice(0,10).map(x=>'<div class="card"><div class="type">PART</div><b>'+esc(x.parts_no)+'</b>｜'+esc(x.name||'')+'<br><span class="sub">'+esc(x.models||'')+'</span></div>').join(''):'')+(mh.length?'<h3>相關手冊</h3>'+mh.map(x=>'<div class="card"><div class="type">MANUAL</div><b>'+esc(x.model||'')+'</b>｜'+esc(x.title||'')+'<br><a href="manuals.html">開啟工程手冊 →</a></div>').join(''):'');window.ricohTrack?.('ai_query',q)}$('go').onclick=ask;$('q').onkeydown=e=>{if(e.key==='Enter')ask()};</script><script src="analytics.js"></script></body></html>
