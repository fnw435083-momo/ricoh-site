<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>問題回報｜RICOH Smart Hub</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--blue:#0878e8;--navy:#08295d;--ink:#173456;--sub:#60758f;--line:#d8e6f3;--bg:#f3f8fd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',Arial,sans-serif}.nav{height:64px;background:linear-gradient(100deg,#061d46,#0a4f9e 58%,#087bdc);display:flex;align-items:center;justify-content:space-between;padding:0 5%;color:#fff}.nav a{color:#fff;text-decoration:none;font-weight:900}.wrap{max-width:820px;margin:auto;padding:38px 20px 70px}.hero{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;margin-bottom:16px}.kicker{font-size:10px;letter-spacing:.15em;font-weight:900;color:var(--blue)}h1{margin:5px 0;font-size:30px;color:var(--navy)}.sub{font-size:12px;color:var(--sub);line-height:1.8}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.label{display:block;font-size:11px;font-weight:900;color:#315677;margin:2px 0 6px}.input,.select,.textarea{width:100%;border:1px solid #cbdbea;border-radius:9px;padding:11px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}.textarea{min-height:150px;resize:vertical}.btn{margin-top:16px;width:100%;border:0;border-radius:9px;padding:12px;background:var(--blue);color:#fff;font-weight:900;font-size:14px;cursor:pointer}.hint{font-size:10px;color:var(--sub);margin-top:5px}.msg{margin-top:14px;padding:12px;border-radius:9px;font-size:12px}.ok{background:#edf9f1;color:#21733b}.err{background:#fff2f2;color:#a32626}.success{text-align:center;padding:28px}.success b{font-size:20px;color:#21733b}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="nav"><a href="index.html">RICOH Smart Hub</a><a href="index.html">← 回首頁</a></header><main class="wrap"><section class="hero"><div class="kicker">ENGINEERING FEEDBACK</div><h1>問題回報</h1><div class="sub">遇到資料錯誤、功能異常、內容缺漏，或有更好的建議，都可以從這裡回報。<br>回報會直接進入 RICOH Smart Hub 管理後台，方便後續整理與處理。</div></section><section class="panel" id="formPanel"><div class="grid"><div><label class="label">回報類型 *</label><select id="category" class="select"><option>資料錯誤</option><option>功能異常</option><option>內容缺漏</option><option>新增資料</option><option>功能建議</option><option>其他</option></select></div><div><label class="label">問題頁面</label><input id="page" class="input" placeholder="例如：SC Code、零件資料庫"></div><div class="full"><label class="label">主旨</label><input id="subject" class="input" maxlength="120" placeholder="例如：IM C3000 的 SC362-01 說明有誤"></div><div class="full"><label class="label">問題／建議內容 *</label><textarea id="description" class="textarea" maxlength="3000" placeholder="請盡量描述：哪一台機器、哪個料號／SC、發生什麼問題，以及你希望怎麼修改。"></textarea><div class="hint">最多 3000 字</div></div><div><label class="label">聯絡方式（選填）</label><input id="contact" class="input" maxlength="120" placeholder="Email、LINE、分機等"></div><div><label class="label">目前頁面</label><input id="autoPage" class="input" readonly></div></div><button id="submit" class="btn">送出回報</button><div id="msg"></div></section><section id="success" class="panel success hidden"><b>✓ 回報已送出</b><p class="sub">謝謝你的回報。資料已進入工程管理後台。</p><button class="btn" onclick="location.href='index.html'">回 RICOH Smart Hub</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ppzdwearxmxrkqgcphvt.supabase.co','sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb');const $=id=>document.getElementById(id);$('autoPage').value=document.referrer?new URL(document.referrer).pathname.replace(/^\//,'')||'index.html':'index.html';$('page').value=$('autoPage').value;$('submit').onclick=async()=>{const description=$('description').value.trim();if(!description){$('msg').innerHTML='<div class="msg err">請填寫問題／建議內容。</div>';return}const b=$('submit');b.disabled=true;b.textContent='送出中…';const r=await db.from('issue_reports').insert({category:$('category').value,page:$('page').value.trim(),subject:$('subject').value.trim(),description,contact:$('contact').value.trim(),reporter_id:localStorage.getItem('ricoh_smart_hub_visitor_id')||''});if(r.error){$('msg').innerHTML='<div class="msg err">送出失敗：'+r.error.message+'</div>';b.disabled=false;b.textContent='送出回報';return}$('formPanel').classList.add('hidden');$('success').classList.remove('hidden')};</script><script src="analytics.js"></script></body></html>
