<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>機器履歷管理｜RICOH Smart Hub</title><style>body{margin:0;background:#f4f8fc;font-family:Arial,"Noto Sans TC",sans-serif;color:#173456}.nav{padding:17px 5%;background:#08295d;color:#fff;display:flex;justify-content:space-between}.nav a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:1050px;margin:auto;padding:28px 20px}.panel{background:#fff;border:1px solid #dbe8f5;border-radius:13px;padding:18px;margin-bottom:14px}.login{max-width:420px;margin:40px auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{display:block;font-size:10px;font-weight:900;color:#52708d;margin-top:7px}input,textarea,select{width:100%;box-sizing:border-box;margin-top:4px;padding:10px;border:1px solid #cbdceb;border-radius:8px;font-family:inherit}textarea{min-height:70px}.btn{border:0;border-radius:8px;padding:10px 15px;background:#0878e8;color:#fff;font-weight:800;cursor:pointer}.red{background:#fff0f0;color:#a32626;border:1px solid #f0caca}.actions{display:flex;gap:8px;margin-top:12px}.hidden{display:none}.row{padding:10px 0;border-bottom:1px solid #e6eef6;font-size:11px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="nav"><a href="index.html">RICOH Smart Hub</a><a href="machine.html">← 機器履歷</a></header><main class="wrap"><h1>機器維修履歷管理</h1><section id="login" class="panel login"><b>管理員登入</b><label>帳號</label><input id="email" value="admin"><label>密碼</label><input id="pw" type="password"><div class="actions"><button class="btn" id="lb">登入</button></div><div id="lm"></div></section><section id="admin" class="hidden"><div class="panel"><h3>新增維修紀錄</h3><div class="grid"><div><label>日期</label><input id="date" type="date"></div><div><label>機號 *</label><input id="machine"></div><div><label>機型</label><input id="model"></div><div><label>SC Code</label><input id="sc"></div><div class="full"><label>問題</label><textarea id="issue"></textarea></div><div class="full"><label>處理</label><textarea id="solution"></textarea></div><div><label>相關料號</label><input id="parts"></div><div><label>狀態</label><input id="status" value="完成"></div></div><div class="actions"><button class="btn" id="save">儲存</button></div><div id="msg"></div></div><div class="panel"><input id="q" placeholder="搜尋機號…"><div id="list"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ppzdwearxmxrkqgcphvt.supabase.co','sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb'),ADMIN='willie.lee@ricoh.com.tw',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));$('lb').onclick=async()=>{let e=$('email').value.trim();if(e==='admin')e=ADMIN;const r=await db.auth.signInWithPassword({email:e,password:$('pw').value});if(r.error){$('lm').textContent='登入失敗：'+r.error.message;return}init()};async function init(){const u=(await db.auth.getUser()).data.user;if(!u||u.email!==ADMIN)return;$('login').classList.add('hidden');$('admin').classList.remove('hidden');load()}async function load(){const r=await db.from('machine_history').select('*').order('created_at',{ascending:false}).limit(300);const q=$('q').value.toUpperCase();$('list').innerHTML=(r.data||[]).filter(x=>!q||String(x.machine_no).toUpperCase().includes(q)).map(x=>'<div class="row"><b>'+esc(x.machine_no)+'</b>｜'+esc(x.service_date||'')+'｜'+esc(x.sc_code||'')+'｜'+esc(x.issue||'')+' <button class="btn red" onclick="del('+x.id+')">刪除</button></div>').join('')||'沒有資料'}window.del=async id=>{if(confirm('確定刪除？')){await db.from('machine_history').delete().eq('id',id);load()}};$('save').onclick=async()=>{const row={service_date:$('date').value||null,machine_no:$('machine').value.trim(),model:$('model').value.trim(),sc_code:$('sc').value.trim(),issue:$('issue').value.trim(),solution:$('solution').value.trim(),parts_no:$('parts').value.trim(),status:$('status').value.trim()};if(!row.machine_no){$('msg').textContent='機號必填';return}const r=await db.from('machine_history').insert(row);$('msg').textContent=r.error?'失敗：'+r.error.message:'已儲存';if(!r.error){$('machine').value='';$('issue').value='';$('solution').value='';load()}};$('q').oninput=load;init()</script></body></html>
