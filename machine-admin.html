<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>機器履歷管理｜RICOH Smart Hub</title><style>body{margin:0;background:#f4f8fc;font-family:Arial,"Noto Sans TC",sans-serif;color:#173456}.nav{padding:17px 5%;background:#08295d;color:#fff;display:flex;justify-content:space-between}.nav a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:28px 20px}.panel{background:#fff;border:1px solid #dbe8f5;border-radius:13px;padding:18px;margin-bottom:14px}.login{max-width:420px;margin:40px auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{display:block;font-size:10px;font-weight:900;color:#52708d;margin-top:7px}input,textarea,select{width:100%;box-sizing:border-box;margin-top:4px;padding:10px;border:1px solid #cbdceb;border-radius:8px;font-family:inherit}textarea{min-height:70px}.btn{border:0;border-radius:8px;padding:10px 15px;background:#0878e8;color:#fff;font-weight:800;cursor:pointer}.red{background:#fff0f0;color:#a32626;border:1px solid #f0caca}.gray{background:#eef5fc;color:#315677}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.hidden{display:none}.row{padding:12px 0;border-bottom:1px solid #e6eef6;font-size:11px}.sub{font-size:10px;color:#60758f}.tag{display:inline-block;padding:3px 7px;border-radius:6px;background:#eef5fc;font-size:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="nav"><a href="index.html">RICOH Smart Hub</a><a href="machine.html">← 機器履歷</a></header><main class="wrap"><h1>機器維修履歷管理</h1><section id="login" class="panel login"><b>管理員登入</b><label>帳號</label><input id="email" value="admin"><label>密碼</label><input id="pw" type="password"><div class="actions"><button class="btn" id="lb">登入</button></div><div id="lm"></div></section><section id="admin" class="hidden"><div class="panel"><h3 id="ft">新增維修紀錄</h3><div class="grid"><div><label>日期</label><input id="date" type="date"></div><div><label>機號 *</label><input id="machine"></div><div><label>客戶</label><input id="customer"></div><div><label>機型</label><input id="model"></div><div><label>SC Code</label><input id="sc"></div><div><label>相關料號</label><input id="parts"></div><div><label>工程師</label><input id="engineer" value="TY0032 Willie.lee"></div><div><label>狀態</label><input id="status" value="完成"></div><div class="full"><label>問題</label><textarea id="issue"></textarea></div><div class="full"><label>處理</label><textarea id="solution"></textarea></div></div><div class="actions"><button class="btn" id="save">儲存</button><button class="btn gray" id="cancel">清除</button></div><div id="msg"></div></div><div class="panel"><input id="q" placeholder="搜尋機號、客戶、機型、SC、料號…"><div id="list">載入中…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ppzdwearxmxrkqgcphvt.supabase.co','sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb'),ADMIN='willie.lee@ricoh.com.tw',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let ALL=[],edit=null;async function init(){const u=(await db.auth.getUser()).data.user;if(!u||u.email!==ADMIN)return;$('login').classList.add('hidden');$('admin').classList.remove('hidden');load()}$('lb').onclick=async()=>{let e=$('email').value.trim();if(e==='admin')e=ADMIN;const r=await db.auth.signInWithPassword({email:e,password:$('pw').value});if(r.error){$('lm').textContent='登入失敗：'+r.error.message;return}init()};async function load(){const r=await db.from('machine_history').select('*').order('created_at',{ascending:false}).limit(500);if(r.error){$('list').textContent='載入失敗：'+r.error.message;return}ALL=r.data||[];render()}function render(){const q=$('q').value.toUpperCase(),a=ALL.filter(x=>!q||[x.machine_no,x.customer,x.model,x.sc_code,x.issue,x.solution,x.parts_no,x.engineer].join(' ').toUpperCase().includes(q));$('list').innerHTML=a.map(x=>'<div class="row"><b>'+esc(x.machine_no)+'</b>｜'+esc(x.service_date||'')+'｜'+esc(x.model||'')+'｜'+esc(x.sc_code||'一般維修')+' <span class="tag">'+esc(x.status||'')+'</span><div class="sub">'+esc(x.customer||'')+'｜'+esc(x.issue||'')+'</div><div class="actions"><button class="btn gray" onclick="editRow('+x.id+')">修改</button><button class="btn red" onclick="del('+x.id+')">刪除</button></div></div>').join('')||'沒有資料'}function clear(){edit=null;$('ft').textContent='新增維修紀錄';['date','machine','customer','model','sc','parts','issue','solution'].forEach(id=>$(id).value='');$('engineer').value='TY0032 Willie.lee';$('status').value='完成';$('msg').textContent=''}window.editRow=id=>{const x=ALL.find(v=>v.id===id);if(!x)return;edit=id;$('ft').textContent='修改維修紀錄';$('date').value=x.service_date||'';$('machine').value=x.machine_no||'';$('customer').value=x.customer||'';$('model').value=x.model||'';$('sc').value=x.sc_code||'';$('parts').value=x.parts_no||'';$('engineer').value=x.engineer||'';$('status').value=x.status||'';$('issue').value=x.issue||'';$('solution').value=x.solution||'';scrollTo({top:0,behavior:'smooth'})};window.del=async id=>{if(!confirm('確定刪除這筆履歷？'))return;const r=await db.from('machine_history').delete().eq('id',id);if(r.error){alert('刪除失敗：'+r.error.message);return}load()};$('save').onclick=async()=>{const row={service_date:$('date').value||null,machine_no:$('machine').value.trim(),customer:$('customer').value.trim(),model:$('model').value.trim(),sc_code:$('sc').value.trim(),issue:$('issue').value.trim(),solution:$('solution').value.trim(),parts_no:$('parts').value.trim(),engineer:$('engineer').value.trim(),status:$('status').value.trim()};if(!row.machine_no){$('msg').textContent='機號必填';return}const r=edit?await db.from('machine_history').update(row).eq('id',edit):await db.from('machine_history').insert(row);if(r.error){$('msg').textContent='儲存失敗：'+r.error.message;return}$('msg').textContent='儲存完成';clear();load()};$('cancel').onclick=clear;$('q').oninput=render;init()</script></body></html>
