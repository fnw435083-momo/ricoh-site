<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工程手冊中心｜RICOH Smart Service Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1677e8;--blue2:#0754c7;--cyan:#55e7ff;--navy:#08295d;--ink:#10233f;--sub:#536783;--line:#dbe8f5;--soft:#f2f8ff;--max:1120px}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;color:var(--ink);background:#f5f9fd;line-height:1.7}a{text-decoration:none;color:inherit}.nav{height:64px;background:linear-gradient(100deg,#061d46,#0a4f9e 58%,#087bdc);color:#fff;display:flex;align-items:center;padding:0 max(20px,5%);box-shadow:0 4px 20px #06295d33}.brand{font-weight:900;font-size:19px}.wrap{max-width:var(--max);margin:auto;padding:48px 20px 70px}.hero{background:linear-gradient(135deg,#fff,#edf8ff);border:1px solid var(--line);border-radius:20px;padding:36px;margin-bottom:22px;box-shadow:0 10px 35px #0b5ca012}.kicker{font-size:11px;color:#0874d8;font-weight:800;letter-spacing:.14em}.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.2;margin:8px 0 10px;color:#092754}.hero p{color:var(--sub);font-size:14px}.search{margin-top:24px;display:flex;gap:10px}.search input{flex:1;border:1px solid #cbddec;border-radius:10px;padding:13px 15px;font-size:15px;outline:none}.search input:focus{border-color:#4cbfff;box-shadow:0 0 0 3px #55e7ff22}.count{font-size:12px;color:#71849b;margin:16px 2px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 5px 18px #0b5ca00b;transition:.2s}.card:hover{transform:translateY(-2px);box-shadow:0 12px 30px #0b5ca018}.model{display:inline-block;background:#eaf6ff;color:#0870d5;font-size:11px;font-weight:800;border-radius:5px;padding:4px 8px}.card h2{font-size:19px;margin:11px 0 3px}.meta{font-size:12px;color:#72859c;margin-bottom:16px}.open{display:inline-flex;background:linear-gradient(135deg,#168cff,#075bd1);color:#fff;border-radius:8px;padding:10px 15px;font-size:13px;font-weight:700}.empty,.error{background:#fff;border:1px dashed #cbddec;border-radius:14px;padding:28px;text-align:center;color:var(--sub)}.error{border-color:#f0c2c2;color:#a33}.loading{text-align:center;color:var(--sub);padding:30px}@media(max-width:700px){.wrap{padding:28px 14px 50px}.hero{padding:25px}.grid{grid-template-columns:1fr}.search{flex-direction:column}.search input{width:100%}}
</style>
</head>
<body>
<header class="nav"><a class="brand" href="index.html">RICOH Smart Service Hub</a></header>
<main class="wrap">
<section class="hero"><div class="kicker">ENGINEERING DOCUMENT CENTER</div><h1>工程手冊中心</h1><p>集中查找 Service Manual、Field Service 與工程文件。輸入機型或手冊名稱即可搜尋。</p><div class="search"><input id="search" type="search" placeholder="搜尋機型，例如 IM C3000、D365、Service Manual"><a class="open" href="index.html">回首頁</a></div></section>
<div id="count" class="count">載入中…</div><div id="list" class="grid"><div class="loading">正在讀取工程手冊…</div></div>
</main>
<script>
const SUPABASE_URL='https://ppzdwearxmxrkqgcphvt.supabase.co';
const SUPABASE_KEY='sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let manuals=[];
function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const rows=manuals.filter(x=>[x.model,x.title,x.version,x.file_path].some(v=>String(v??'').toLowerCase().includes(q)));document.getElementById('count').textContent=`共 ${rows.length} 份文件`;
if(!rows.length){document.getElementById('list').innerHTML='<div class="empty">找不到符合的工程手冊。</div>';return}
document.getElementById('list').innerHTML=rows.map(x=>{const path=String(x.file_path||'').split('/').map(encodeURIComponent).join('/');const url=`${SUPABASE_URL}/storage/v1/object/public/manuals/${path}`;return `<article class="card"><span class="model">${escapeHtml(x.model||'未分類')}</span><h2>${escapeHtml(x.title||x.file_path||'未命名文件')}</h2><div class="meta">版本：${escapeHtml(x.version||'—')}　｜　檔案：${escapeHtml(x.file_path||'—')}</div><a class="open" href="${url}" target="_blank" rel="noopener">開啟手冊 →</a></article>`}).join('')}
async function load(){const {data,error}=await client.from('manuals').select('id,model,title,version,file_path,created_at').order('created_at',{ascending:false});if(error){document.getElementById('count').textContent='讀取失敗';document.getElementById('list').innerHTML=`<div class="error">無法讀取手冊資料。請確認 Supabase 的 manuals 資料表已建立 SELECT 讀取權限。<br><small>${escapeHtml(error.message)}</small></div>`;return}manuals=data||[];render()}
document.getElementById('search').addEventListener('input',render);load();
</script>
</body>
</html>
