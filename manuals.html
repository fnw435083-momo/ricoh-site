<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工程手冊中心｜RICOH Smart Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1677e8;--navy:#08295d;--ink:#10233f;--sub:#536783;--line:#dbe8f5;--max:1120px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;color:var(--ink);background:#f5f9fd;line-height:1.7}
a{text-decoration:none;color:inherit}
.nav{height:64px;background:linear-gradient(100deg,#061d46,#0a4f9e 58%,#087bdc);color:#fff;display:flex;align-items:center;padding:0 max(20px,5%);box-shadow:0 4px 20px #06295d33}
.brand{font-weight:900;font-size:19px}
.home-entry{position:fixed;right:18px;top:82px;z-index:30;background:#08295d;color:#fff!important;border:1px solid #3d6799;border-radius:9px;padding:9px 13px;font-size:11px;font-weight:900;box-shadow:0 5px 18px #08295d33;transition:.18s}
.home-entry:hover{background:#0878e8;border-color:#0878e8}
.wrap{max-width:var(--max);margin:auto;padding:48px 20px 70px}
.hero{background:linear-gradient(135deg,#fff,#edf8ff);border:1px solid var(--line);border-radius:20px;padding:36px;margin-bottom:22px;box-shadow:0 10px 35px #0b5ca012}
.kicker{font-size:11px;color:#0874d8;font-weight:800;letter-spacing:.14em}
.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.2;margin:8px 0 10px;color:#092754}
.hero p{color:var(--sub);font-size:14px}
.search{margin-top:24px;display:flex;gap:10px}
.search input{flex:1;border:1px solid #cbddec;border-radius:10px;padding:13px 15px;font-size:15px;outline:none}
.search input:focus{border-color:#4cbfff;box-shadow:0 0 0 3px #55e7ff22}
.count{font-size:12px;color:#71849b;margin:16px 2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 5px 18px #0b5ca00b;transition:.2s}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 30px #0b5ca018}
.model{display:inline-block;background:#eaf6ff;color:#0870d5;font-size:11px;font-weight:800;border-radius:5px;padding:4px 8px}
.card h2{font-size:19px;margin:11px 0 3px}
.meta{font-size:12px;color:#72859c;margin-bottom:16px}
.open{display:inline-flex;border:0;background:linear-gradient(135deg,#168cff,#075bd1);color:#fff;border-radius:8px;padding:10px 15px;font-size:13px;font-weight:700;cursor:pointer}
.empty,.error{background:#fff;border:1px dashed #cbddec;border-radius:14px;padding:28px;text-align:center;color:var(--sub)}
.error{border-color:#f0c2c2;color:#a33}
.loading{text-align:center;color:var(--sub);padding:30px}
.hint{font-size:11px;color:#7b8da3;margin-top:10px}
@media(max-width:700px){.wrap{padding:28px 14px 50px}.hero{padding:25px}.grid{grid-template-columns:1fr}.search{flex-direction:column}.search input{width:100%}.home-entry{top:72px;right:12px}}
</style>
</head>
<body>
<a class="home-entry" href="index.html">← 回首頁</a>
<header class="nav"><a class="brand" href="index.html">RICOH Smart Service Hub</a></header>
<main class="wrap">
<section class="hero"><div class="kicker">ENGINEERING DOCUMENT CENTER</div><h1>工程手冊中心</h1><p>集中查找 Service Manual、Field Service 與工程文件。只要把 PDF 上傳到 Supabase 的 manuals 資料夾，這裡就會自動顯示。</p><div class="search"><input id="search" type="search" placeholder="搜尋機型、手冊名稱或檔名，例如 IM C2000"></div><div class="hint">新上傳的 PDF 不需要再手動新增資料列。</div></section>
<div id="count" class="count">載入中…</div><div id="list" class="grid"><div class="loading">正在讀取工程手冊…</div></div>
</main>
<script>
const SUPABASE_URL='https://ppzdwearxmxrkqgcphvt.supabase.co';
const SUPABASE_KEY='sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb';
const client=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
let manuals=[];
function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fileTitle(path){const n=String(path).split('/').pop()||path;return n.replace(/\.[^.]+$/,'')}
function inferModel(name){let n=fileTitle(name).replace(/[_-]+/g,' ').trim();n=n.replace(/\s+/g,' ');return n||'未分類'}
async function openManual(path){if(!client){alert('Supabase SDK 未載入，請檢查 CDN 連線');return}if(window.ricohTrack)window.ricohTrack('open_manual',path);const {data,error}=await client.storage.from('manuals').createSignedUrl(path,3600);if(error||!data?.signedUrl){alert('無法取得手冊連結：'+(error?.message||'Unknown error'));return}window.open(data.signedUrl,'_blank','noopener')}
async function listAll(prefix=''){let out=[];let offset=0;while(true){const {data,error}=await client.storage.from('manuals').list(prefix,{limit:100,offset,sortBy:{column:'name',order:'asc'}});if(error)throw error;if(!data?.length)break;for(const item of data){const path=prefix?`${prefix}/${item.name}`:item.name;if(item.id===null){out=out.concat(await listAll(path));}else{out.push({file_path:path,storage:true});}}if(data.length<100)break;offset+=100;}return out}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const rows=manuals.filter(x=>[x.model,x.title,x.version,x.file_path].some(v=>String(v??'').toLowerCase().includes(q)));document.getElementById('count').textContent=`共 ${rows.length} 份文件`;if(!rows.length){document.getElementById('list').innerHTML='<div class="empty">找不到符合的工程手冊。</div>';return}document.getElementById('list').innerHTML=rows.map((x,i)=>`<article class="card"><span class="model">${escapeHtml(x.model||'未分類')}</span><h2>${escapeHtml(x.title||fileTitle(x.file_path)||'未命名文件')}</h2><div class="meta">版本：${escapeHtml(x.version||'—')}　｜　檔案：${escapeHtml(x.file_path||'—')}</div><button class="open" type="button" data-index="${i}">開啟手冊 →</button></article>`).join('');document.querySelectorAll('[data-index]').forEach(btn=>btn.addEventListener('click',()=>openManual(rows[Number(btn.dataset.index)].file_path)))}
async function load(){
 const count=document.getElementById('count'),list=document.getElementById('list');
 count.textContent='正在讀取…';
 const warnings=[];
 let dbRows=[],storageRows=[];
 if(!client){warnings.push('Supabase SDK 無法載入（CDN 連線失敗）');}
 else {
  const results=await Promise.allSettled([
   client.from('manuals').select('id,model,title,version,file_path,created_at').order('created_at',{ascending:false}).then(r=>{if(r.error)throw r.error;return r.data||[]}),
   listAll()
  ]);
  if(results[0].status==='fulfilled')dbRows=results[0].value;
  else warnings.push('資料表讀取失敗：'+String(results[0].reason?.message||results[0].reason));
  if(results[1].status==='fulfilled')storageRows=results[1].value;
  else warnings.push('Storage 檔案列表讀取失敗：'+String(results[1].reason?.message||results[1].reason));
 }
 const meta=new Map(dbRows.map(x=>[x.file_path,x]));
 manuals=storageRows.map(x=>meta.get(x.file_path)||{model:inferModel(x.file_path),title:fileTitle(x.file_path),version:'',file_path:x.file_path});
 for(const m of dbRows)if(!manuals.some(x=>x.file_path===m.file_path))manuals.push(m);
 if(!manuals.length){
  // Read-only emergency catalog: filenames previously verified in this project.
  manuals=[
   {model:'D365',title:'D365 Field Service',version:'0313',file_path:'D365-Field-Service_0313.pdf'},
   {model:'IM C2000',title:'IMC2000',version:'',file_path:'IMC2000.pdf'}
  ];
  warnings.push('目前顯示已知手冊的離線目錄；開啟 PDF 仍需 Supabase 連線');
 }
 render();
 if(warnings.length){
  const notice=document.createElement('div');
  notice.className='error';
  notice.style.cssText='grid-column:1/-1;text-align:left;overflow-wrap:anywhere';
  notice.innerHTML='<strong>部分資料來源連線異常</strong><br>'+warnings.map(escapeHtml).join('<br>')+'<br><small>若顯示 Failed to fetch，代表瀏覽器未取得 HTTP 回應，請檢查網路、DNS、阻擋規則或瀏覽器擴充功能；不是直接判定 RLS 權限問題。</small>';
  list.prepend(notice);
 }
}

document.getElementById('search').addEventListener('input',render);load();
</script>
<script src="analytics.js"></script>
</body>
</html>
