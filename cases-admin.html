<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>維修案例管理｜RICOH Smart Hub</title><style>body{margin:0;background:#f4f8fc;font-family:"Noto Sans TC",Arial,sans-serif;color:#173456}.nav{padding:17px 5%;background:#08295d;color:#fff;display:flex;justify-content:space-between}.nav a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:28px 20px}.panel{background:#fff;border:1px solid #dbe8f5;border-radius:13px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{display:block;font-size:10px;font-weight:900;color:#52708d}input,textarea,select{width:100%;box-sizing:border-box;margin-top:5px;padding:10px;border:1px solid #cbdceb;border-radius:8px;font-family:inherit}textarea{min-height:80px}.btn{border:0;border-radius:8px;padding:10px 15px;background:#0878e8;color:#fff;font-weight:800;cursor:pointer}.red{background:#fff0f0;color:#a32626;border:1px solid #f0caca}.actions{display:flex;gap:8px;margin-top:12px}.msg{font-size:12px;margin-top:10px}.hidden{display:none}.login{max-width:430px;margin:40px auto}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="nav"><a href="index.html">RICOH Smart Hub</a><a href="cases.html">← 案例</a></header><main class="wrap"><h1>維修案例管理</h1><section id="login" class="panel login"><b>管理員登入</b><label>帳號</label><input id="email" value="admin"><label>密碼</label><input id="pw" type="password"><div class="actions"><button class="btn" id="loginBtn">登入</button></div><div id="loginMsg"></div></section><section id="admin" class="hidden"><div class="panel"><h3 id="ft">新增案例</h3><div class="grid"><div><label>標題 *</label><input id="title"></div><div><label>機型</label><input id="model"></div><div><label>SC Code</label><input id="sc"></div><div><label>相關料號</label><input id="parts"></div><div class="full"><label>故障症狀</label><textarea id="sym"></textarea></div><div class="full"><label>主要原因</label><textarea id="cause"></textarea></div><div class="full"><label>處理方式</label><textarea id="sol"></textarea></div><div><label>來源</label><input id="source"></div><div><label>狀態</label><select id="status"><option>published</option><option>draft</option></select></div></div><div class="actions"><button class="btn" id="save">儲存</button><button class="btn red" id="cancel">清除</button></div><div id="msg"></div></div><div class="panel"><input id="q" placeholder="搜尋案例…"><div id="list" style="margin-top:12px"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ppzdwearxmxrkqgcphvt.supabase.co','sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb'),ADMIN='willie.lee@ricoh.com.tw';const $=id=>document.getElementById(id);let edit=null,ALL=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function init(){const u=(await db.auth.getUser()).data.user;if(!u||u.email!==ADMIN){$('login').classList.remove('hidden');return}$('login').classList.add('hidden');$('admin').classList.remove('hidden');load()}$('loginBtn').onclick=async()=>{let e=$('email').value.trim();if(e==='admin')e=ADMIN;const r=await db.auth.signInWithPassword({email:e,password:$('pw').value});if(r.error){$('loginMsg').textContent='登入失敗：'+r.error.message;return}init()};async function load(){const r=await db.from('repair_cases').select('*').order('created_at',{ascending:false});ALL=r.data||[];render()}function render(){const q=$('q').value.toUpperCase();const a=ALL.filter(x=>!q||[x.title,x.model,x.sc_code,x.parts_no,x.symptoms].join(' ').toUpperCase().includes(q));$('list').innerHTML=a.map(x=>'<div style="padding:12px 0;border-bottom:1px solid #e6eef6"><b>'+esc(x.title)+'</b><div style="font-size:11px;color:#60758f">'+esc(x.model||'')+'｜'+esc(x.sc_code||'')+'｜'+esc(x.status)+'</div><button class="btn" onclick="editCase('+x.id+')">修改</button> <button class="btn red" onclick="delCase('+x.id+')">刪除</button></div>').join('')||'<div>沒有資料</div>'}function clear(){edit=null;$('ft').textContent='新增案例';['title','model','sc','parts','sym','cause','sol','source'].forEach(x=>$(x).value='');$('status').value='published'}window.editCase=id=>{const x=ALL.find(v=>v.id===id);if(!x)return;edit=id;$('ft').textContent='修改案例';$('title').value=x.title||'';$('model').value=x.model||'';$('sc').value=x.sc_code||'';$('parts').value=x.parts_no||'';$('sym').value=x.symptoms||'';$('cause').value=x.cause||'';$('sol').value=x.solution||'';$('source').value=x.source||'';$('status').value=x.status||'published';scrollTo({top:0,behavior:'smooth'})};window.delCase=async id=>{if(!confirm('確定刪除？'))return;await db.from('repair_cases').delete().eq('id',id);load()};$('save').onclick=async()=>{const row={title:$('title').value.trim(),model:$('model').value.trim(),sc_code:$('sc').value.trim(),parts_no:$('parts').value.trim(),symptoms:$('sym').value.trim(),cause:$('cause').value.trim(),solution:$('sol').value.trim(),source:$('source').value.trim(),status:$('status').value};if(!row.title){$('msg').textContent='請輸入標題';return}const r=edit?await db.from('repair_cases').update({...row,updated_at:new Date().toISOString()}).eq('id',edit):await db.from('repair_cases').insert(row);$('msg').textContent=r.error?'儲存失敗：'+r.error.message:'儲存完成';if(!r.error){clear();load()}};$('cancel').onclick=clear;$('q').oninput=render;init()</script></body></html>
