<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>問題回報管理｜RICOH Smart Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f9fd;color:#173456;font-family:'Noto Sans TC',Arial,sans-serif}.nav{height:64px;background:linear-gradient(100deg,#061d46,#0a4f9e 58%,#087bdc);display:flex;align-items:center;justify-content:space-between;padding:0 5%;color:#fff}.nav a{color:#fff;text-decoration:none;font-weight:900}.wrap{max-width:1280px;margin:auto;padding:28px 20px 60px}.title{font-size:30px;font-weight:900;color:#0b2d59}.sub{font-size:11px;color:#60758f;line-height:1.7}.panel{background:#fff;border:1px solid #dbe8f5;border-radius:14px;padding:18px;margin:16px 0}.login{max-width:480px;margin:40px auto}.label{font-size:11px;font-weight:900;color:#315677;display:block;margin-top:12px}.input,.select,.textarea{width:100%;border:1px solid #c9d9e8;border-radius:8px;padding:10px;font:inherit;font-size:12px}.btn{border:0;border-radius:8px;padding:10px 14px;background:#0878e8;color:#fff;font-weight:900;cursor:pointer}.btn.gray{background:#eef5fc;color:#315677}.btn.green{background:#edf9f1;color:#21733b}.btn.red{background:#fff0f0;color:#a32626;border:1px solid #f0caca}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.msg{padding:10px;border-radius:8px;margin-top:10px;font-size:12px}.err{background:#fff2f2;color:#a32626}.ok{background:#edf9f1;color:#21733b}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f8fbfe;border:1px solid #e2edf7;border-radius:10px;padding:14px}.stat b{display:block;font-size:24px;color:#0874d8}.stat span{font-size:10px;color:#60758f}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar .input{max-width:300px}.count{font-size:11px;color:#60758f}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:10px 8px;border-bottom:1px solid #e6eef6;text-align:left;vertical-align:top}th{background:#f8fbfe;color:#52708d}.tag{display:inline-block;padding:3px 8px;border-radius:6px;background:#eef5fc;font-size:10px;font-weight:900}.tag.wait{background:#fff7df;color:#8a6500}.tag.doing{background:#eaf4ff;color:#1764a5}.tag.done{background:#edf9f1;color:#21733b}.tag.ignore{background:#f1f3f5;color:#687583}.detail{white-space:pre-wrap;line-height:1.7;max-width:420px}.mono{font-family:Consolas,monospace;color:#0874d8;font-weight:900}@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}table{display:block;overflow:auto;white-space:nowrap}}@media(max-width:500px){.stats{grid-template-columns:1fr}}</style></head><body><header class="nav"><a href="index.html">RICOH Smart Hub</a><a href="index.html">← 回首頁</a></header><main class="wrap"><div class="title">工程問題回報管理</div><div class="sub">只有管理員登入後可以查看與處理回報。</div><section id="loginPanel" class="panel login"><h3>管理員登入</h3><div class="label">帳號</div><input id="email" class="input" value="admin"><div class="label">密碼</div><input id="password" class="input" type="password"><div class="actions"><button id="login" class="btn">登入</button></div><div id="loginMsg"></div></section><section id="adminPanel" class="hidden"><section class="panel"><div class="toolbar"><span id="userInfo"></span><button id="logout" class="btn gray">登出</button><button id="reload" class="btn gray">重新整理</button></div></section><section class="stats"><div class="stat"><b id="total">0</b><span>全部回報</span></div><div class="stat"><b id="wait">0</b><span>待處理</span></div><div class="stat"><b id="doing">0</b><span>處理中</span></div><div class="stat"><b id="done">0</b><span>已完成</span></div></section><section class="panel"><div class="toolbar"><input id="search" class="input" placeholder="搜尋主旨、內容、頁面、回報類型"><select id="filter" class="select" style="width:auto"><option value="">全部狀態</option><option>待處理</option><option>處理中</option><option>已完成</option><option>不採用</option></select><span id="count" class="count"></span></div><div id="list" style="margin-top:14px">載入中…</div></section></section></main><script>const db=supabase.createClient('https://ppzdwearxmxrkqgcphvt.supabase.co','sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb'),ADMIN='willie.lee@ricoh.com.tw';let ALL=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function msg(id,t,e=false){$(id).innerHTML=t?'<div class="msg '+(e?'err':'ok')+'">'+esc(t)+'</div>':''}async function session(){return(await db.auth.getSession()).data.session}async function init(){const s=await session();if(!s){$('loginPanel').classList.remove('hidden');$('adminPanel').classList.add('hidden');return}if((s.user.email||'').toLowerCase()!==ADMIN){await db.auth.signOut();msg('loginMsg','此帳號沒有管理權限。',true);return}$('loginPanel').classList.add('hidden');$('adminPanel').classList.remove('hidden');$('userInfo').textContent='已登入：'+s.user.email;await load()}async function load(){const r=await db.from('issue_reports').select('*').order('created_at',{ascending:false});if(r.error){$('list').innerHTML='<div class="msg err">資料載入失敗：'+esc(r.error.message)+'</div>';return}ALL=r.data||[];render()}function render(){const q=$('search').value.trim().toUpperCase(),f=$('filter').value;let rows=ALL.filter(x=>(!f||x.status===f)&&(!q||[x.category,x.page,x.subject,x.description,x.contact].join(' ').toUpperCase().includes(q)));$('total').textContent=ALL.length;$('wait').textContent=ALL.filter(x=>x.status==='待處理').length;$('doing').textContent=ALL.filter(x=>x.status==='處理中').length;$('done').textContent=ALL.filter(x=>x.status==='已完成').length;$('count').textContent=rows.length+' 筆';if(!rows.length){$('list').innerHTML='<div class="sub" style="padding:25px">目前沒有符合條件的回報。</div>';return}$('list').innerHTML='<table><thead><tr><th>時間</th><th>類型／頁面</th><th>主旨</th><th>內容</th><th>聯絡方式</th><th>狀態</th><th>操作</th></tr></thead><tbody>'+rows.map(x=>{const tag=x.status==='待處理'?'wait':x.status==='處理中'?'doing':x.status==='已完成'?'done':'ignore';return '<tr><td>'+new Date(x.created_at).toLocaleString('zh-TW')+'</td><td><span class="tag">'+esc(x.category)+'</span><br><span class="sub">'+esc(x.page||'')+'</span></td><td><b>'+esc(x.subject||'（無主旨）')+'</b></td><td><div class="detail">'+esc(x.description)+'</div></td><td>'+esc(x.contact||'—')+'</td><td><span class="tag '+tag+'">'+esc(x.status)+'</span>'+(x.admin_note?'<br><span class="sub">'+esc(x.admin_note)+'</span>':'')+'</td><td><select class="select" data-id="'+x.id+'" style="width:105px"><option '+(x.status==='待處理'?'selected':'')+'>待處理</option><option '+(x.status==='處理中'?'selected':'')+'>處理中</option><option '+(x.status==='已完成'?'selected':'')+'>已完成</option><option '+(x.status==='不採用'?'selected':'')+'>不採用</option></select><button class="btn gray" style="margin-top:5px" onclick="note('+x.id+')">備註</button></td></tr>'}).join('')+'</tbody></table>';document.querySelectorAll('select[data-id]').forEach(s=>s.onchange=()=>updateStatus(s.dataset.id,s.value))}async function updateStatus(id,status){const patch={status};if(status==='已完成')patch.resolved_at=new Date().toISOString();else patch.resolved_at=null;const r=await db.from('issue_reports').update(patch).eq('id',id);if(r.error){alert('更新失敗：'+r.error.message);return}await load()}window.note=async id=>{const x=ALL.find(v=>String(v.id)===String(id));if(!x)return;const n=prompt('管理員備註：',x.admin_note||'');if(n===null)return;const r=await db.from('issue_reports').update({admin_note:n}).eq('id',id);if(r.error){alert('儲存失敗：'+r.error.message);return}await load()};$('login').onclick=async()=>{msg('loginMsg','');let email=$('email').value.trim();if(email.toLowerCase()==='admin')email=ADMIN;const password=$('password').value;if(!password){msg('loginMsg','請輸入密碼。',true);return}const r=await db.auth.signInWithPassword({email,password});if(r.error){msg('loginMsg','登入失敗：'+r.error.message,true);return}await init()};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('reload').onclick=load;$('search').oninput=render;$('filter').onchange=render;init();</script><script src="analytics.js"></script></body></html>
