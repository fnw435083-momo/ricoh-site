<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>資料版本管理｜RICOH Smart Hub</title><style>body{margin:0;background:#f4f8fc;color:#173456;font-family:"Noto Sans TC",Arial,sans-serif}.nav{padding:17px 5%;background:#08295d;color:#fff;display:flex;justify-content:space-between}.nav a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:1050px;margin:auto;padding:30px 20px}.panel{background:#fff;border:1px solid #dbe8f5;border-radius:14px;padding:18px;margin-bottom:14px}.login{max-width:430px;margin:45px auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:10px;font-weight:900;color:#52708d;margin-top:8px}input,textarea,select{width:100%;box-sizing:border-box;margin-top:4px;padding:10px;border:1px solid #cbdceb;border-radius:8px;font-family:inherit}textarea{min-height:80px}.btn{border:0;border-radius:8px;padding:10px 15px;background:#0878e8;color:#fff;font-weight:800;cursor:pointer}.red{background:#fff0f0;color:#a32626;border:1px solid #f0caca}.gray{background:#eef5fc;color:#315677}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.hidden{display:none}.row{padding:12px 0;border-bottom:1px solid #e6eef6}.sub{font-size:11px;color:#60758f}.v{font-size:17px;font-weight:900;color:#0878e8}.msg{font-size:12px;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="nav"><a href="index.html">RICOH Smart Hub</a><a href="versions.html">← 資料版本</a></header><main class="wrap"><h1>資料版本管理</h1><section id="login" class="panel login"><b>管理員登入</b><label>帳號</label><input id="email" value="admin"><label>密碼</label><input id="pw" type="password"><div class="actions"><button class="btn" id="lb">登入</button></div><div id="lm"></div></section><section id="admin" class="hidden"><div class="panel"><h3>新增版本</h3><div class="grid"><div><label>資料類型 *</label><select id="type"><option>SC Code</option><option>零件資料庫</option><option>工程手冊</option><option>維修案例</option><option>機器履歷</option><option>其他</option></select></div><div><label>版本 *</label><input id="version" placeholder="例如 v1.0"></div><div><label>資料量</label><input id="count" type="number" min="0" placeholder="例如 811"></div><div><label>更新者</label><input id="by" value="TY0032 Willie.lee"></div><div class="full"><label>更新說明</label><textarea id="note" placeholder="例如：新增 IM C2000～C6000 原廠 SC 資料。"></textarea></div></div><div class="actions"><button class="btn" id="save">新增版本</button></div><div id="msg"></div></div><div class="panel"><h3>版本紀錄</h3><div id="list">載入中…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ppzdwearxmxrkqgcphvt.supabase.co','sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb'),ADMIN='willie.lee@ricoh.com.tw',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));$('lb').onclick=async()=>{let e=$('email').value.trim();if(e==='admin')e=ADMIN;const r=await db.auth.signInWithPassword({email:e,password:$('pw').value});if(r.error){$('lm').textContent='登入失敗：'+r.error.message;return}init()};async function init(){const u=(await db.auth.getUser()).data.user;if(!u||u.email!==ADMIN){$('lm').textContent='沒有管理權限';return}$('login').classList.add('hidden');$('admin').classList.remove('hidden');load()}async function load(){const r=await db.from('data_versions').select('*').order('created_at',{ascending:false});if(r.error){$('list').textContent='載入失敗：'+r.error.message;return}$('list').innerHTML=(r.data||[]).map(x=>'<div class="row"><div class="v">'+esc(x.data_type)+'｜'+esc(x.version)+'</div><div class="sub">資料量：'+esc(x.item_count)+'｜更新者：'+esc(x.updated_by||'')+'｜'+new Date(x.created_at).toLocaleString('zh-TW')+'</div><div>'+esc(x.note||'')+'</div><button class="btn red" style="margin-top:8px" onclick="del('+x.id+')">刪除</button></div>').join('')||'目前沒有版本資料'}window.del=async id=>{if(!confirm('確定刪除此版本？'))return;const r=await db.from('data_versions').delete().eq('id',id);if(r.error)alert('刪除失敗：'+r.error.message);load()};$('save').onclick=async()=>{const version=$('version').value.trim();if(!version){$('msg').textContent='請輸入版本。';return}const row={data_type:$('type').value,version,item_count:Number($('count').value)||0,updated_by:$('by').value.trim(),note:$('note').value.trim()};const r=await db.from('data_versions').insert(row);$('msg').textContent=r.error?'儲存失敗：'+r.error.message:'新增版本完成';if(!r.error){$('version').value='';$('count').value='';$('note').value='';load()}};init()</script></body></html>
