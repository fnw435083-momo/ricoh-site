<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>機器維修履歷｜RICOH Smart Hub</title><style>body{margin:0;background:#f4f8fc;font-family:"Noto Sans TC",Arial,sans-serif;color:#173456}.top{padding:17px 5%;background:#08295d;color:#fff;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:1000px;margin:auto;padding:30px 20px}.box,.item{background:#fff;border:1px solid #dbe8f5;border-radius:13px;padding:18px}.box input{width:100%;box-sizing:border-box;padding:14px;border:2px solid #cbdceb;border-radius:9px;font-size:16px}.box button{margin-top:9px;border:0;border-radius:8px;background:#0878e8;color:#fff;padding:10px 18px;font-weight:800}.item{margin-top:12px}.meta{font-size:10px;color:#0878e8;font-weight:900}.item h2{font-size:16px}.txt{font-size:12px;line-height:1.8}.empty{text-align:center;padding:40px;background:#fff;border:1px dashed #cbdceb;border-radius:12px;margin-top:15px}</style></head><body><header class="top"><a href="index.html">RICOH Smart Hub</a><a href="machine-admin.html">⚙ 管理履歷</a></header><main class="wrap"><h1>機器維修履歷</h1><div class="box"><div style="font-size:12px;color:#60758f">掃描 QR 後可直接帶入機號；也可以手動輸入。</div><input id="q" placeholder="輸入機號，例如 A123567890"><button id="go">查詢履歷</button></div><div id="out"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://ppzdwearxmxrkqgcphvt.supabase.co','sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb'),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function run(){const q=$('q').value.trim();if(!q)return;const r=await db.from('machine_history').select('*').eq('machine_no',q).order('service_date',{ascending:false});if(r.error){$('out').innerHTML='<div class="empty">查詢失敗：'+esc(r.error.message)+'</div>';return}const a=r.data||[];$('out').innerHTML='<div class="empty" style="text-align:left"><b>機號：</b>'+esc(q)+'<br><b>共 '+a.length+' 筆維修紀錄</b></div>'+(a.length?a.map(x=>'<article class="item"><div class="meta">'+esc(x.service_date||'未記錄')+' ｜ '+esc(x.status||'')+' ｜ '+esc(x.model||'')+'</div><h2>'+esc(x.sc_code||'一般維修')+'</h2>'+(x.issue?'<div class="txt"><b>問題：</b>'+esc(x.issue)+'</div>':'')+(x.solution?'<div class="txt"><b>處理：</b>'+esc(x.solution)+'</div>':'')+(x.parts_no?'<div class="txt"><b>料號：</b>'+esc(x.parts_no)+'</div>':'')+(x.engineer?'<div class="txt"><b>工程師：</b>'+esc(x.engineer)+'</div>':'')+'</article>').join(''):'');}const p=new URLSearchParams(location.search).get('machine');if(p){$('q').value=p;run()}$('go').onclick=run;$('q').onkeydown=e=>{if(e.key==='Enter')run()};</script><script src="analytics.js"></script></body></html>
