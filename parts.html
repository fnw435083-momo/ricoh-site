<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>工程零件資料庫｜RICOH Smart Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--blue:#0878e8;--navy:#08295d;--ink:#173456;--sub:#60758f;--line:#dbe8f5}*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans TC',Arial,sans-serif;color:var(--ink);background:#f5f9fd}a{text-decoration:none;color:inherit}.nav{height:64px;background:linear-gradient(100deg,#061d46,#0a4f9e 58%,#087bdc);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,5%)}.brand{font-weight:900;font-size:20px}.brand span{font-size:11px;font-weight:500;margin-left:10px;color:#dff6ff}.navlinks{display:flex;gap:14px;align-items:center}.back{font-size:12px;font-weight:700}.admin{font-size:12px;font-weight:800;background:#fff;color:#0a4f9e;padding:8px 12px;border-radius:8px}.wrap{max-width:1180px;margin:auto;padding:42px 22px 70px}.kicker{font-size:10px;font-weight:900;letter-spacing:.15em;color:var(--blue);text-transform:uppercase}.title{font-size:34px;font-weight:900;color:#0b2d59;margin:6px 0}.desc{font-size:13px;color:var(--sub);line-height:1.8}.searchbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 8px 28px #0b5ca00b;margin-top:24px}.searchrow{display:flex;gap:10px}.search{flex:1;border:2px solid #c9d9e8;border-radius:9px;padding:15px 16px;font-size:16px;outline:none}.search:focus{border-color:#55b9ff}.clear{border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 20px;font-weight:800;color:#41627f;cursor:pointer}.hint{font-size:11px;color:#8295a8;margin-top:10px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:11px;color:var(--sub)}.stat b{color:#12375e;font-size:15px;margin-right:4px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px}.partno{font-family:Consolas,monospace;color:#0874d8;font-weight:900;font-size:15px}.name{font-size:17px;font-weight:900;color:#14385f;margin-top:7px}.models{font-size:11px;color:#60758f;line-height:1.7;margin-top:8px}.links{margin-top:10px}.link{color:#0878e8;font-size:11px;font-weight:800;margin-right:12px}.empty{text-align:center;background:#fff;border:1px dashed #c9d9e8;border-radius:13px;padding:50px 20px;color:#72879d}.loading{text-align:center;padding:40px;color:#65809c}.error{background:#fff3f3;border:1px solid #f2c4c4;color:#a32626;border-radius:10px;padding:15px;font-size:12px;line-height:1.8}.footer{text-align:center;color:#8aa0b6;font-size:10px;margin-top:40px}@media(max-width:760px){.grid{grid-template-columns:1fr}.title{font-size:28px}.searchrow{flex-direction:column}.clear{height:42px}.nav{padding:0 18px}.brand span{display:none}}</style></head><body><header class="nav"><a class="brand" href="index.html">RICOH <span>Smart Service Hub｜工程師工作中心</span></a><div class="navlinks"><a class="admin" href="parts-admin.html">⚙ 管理料號</a><a class="back" href="index.html">← 回工程師中心</a></div></header><main class="wrap"><div><div class="kicker">Parts Database</div><div class="title">工程零件資料庫</div><div class="desc">可以用機型、料號或零件名稱搜尋。</div></div><section class="searchbox"><div class="searchrow"><input id="q" class="search" placeholder="輸入 IM C3000、D0BK2205、感光鼓…" autocomplete="off"><button id="clear" class="clear">清除</button></div><div class="hint">機型搜尋會鎖定適用機型；輸入 300 只找 300 系列，不會把 3500、4500 等其他系列帶進來。</div></section><div id="stats" class="stats"></div><div id="app"><div class="empty">請輸入機型、料號或零件名稱。</div></div><div class="footer">TY0032-Willie 製作｜資料來源：Supabase 雲端零件資料庫</div></main><script>const SUPABASE_URL='https://ppzdwearxmxrkqgcphvt.supabase.co',SUPABASE_KEY='sb_publishable_S9TK4Q45LNUE-iD2QeNeZQ_-_KvRBFb',client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let timer=null,lastToken=0;function norm(s){return String(s??'').toUpperCase().replace(/\s+/g,'').replace(/[^A-Z0-9]/g,'')}function modelParts(raw){return String(raw??'').toUpperCase().split(/[\/；;、,\n]+/).map(x=>x.trim()).filter(Boolean)}function modelHit(raw,q){const query=norm(q);if(!query)return false;return modelParts(raw).some(part=>{const p=norm(part);if(/^\d+$/.test(query)){const m=p.match(/C(\d+)/);if(!m)return false;return m[1].startsWith(query)}return p===query})}function modelText(raw,q){const query=norm(q);return modelParts(raw).filter(part=>{const p=norm(part);if(/^\d+$/.test(query)){const m=p.match(/C(\d+)/);return !!m&&m[1].startsWith(query)}return p===query}).join('、')}function kind(q){if(/^\d+$/.test(q))return'model';if(/^(IM|MP|MPC|SP|SPC)/i.test(q))return'model';if(/^[A-Z0-9-]+$/i.test(q)&&/\d/.test(q)&&q.length>=5)return'part';return'name'}async function search(){const raw=$('q').value.trim();const token=++lastToken;if(!raw){$('stats').innerHTML='';$('app').innerHTML='<div class="empty">請輸入機型、料號或零件名稱。</div>';return}clearTimeout(timer);$('stats').innerHTML='';$('app').innerHTML='<div class="loading">搜尋中…</div>';const type=kind(raw);let query=client.from('parts').select('id,parts_no,name,models,status,original_names').limit(200);if(type==='model')query=query.ilike('models','%'+raw.replace(/\s+/g,'%')+'%');else if(type==='part')query=query.ilike('parts_no','%'+raw+'%');else query=query.or('name.ilike.%'+raw+'%,original_names.ilike.%'+raw+'%');const {data,error}=await query.order('parts_no');if(token!==lastToken)return;if(error){$('app').innerHTML='<div class="error">零件資料載入失敗：'+esc(error.message)+'</div>';return}let hit=data||[];if(type==='model')hit=hit.filter(x=>modelHit(x.models,raw));else if(type==='part')hit=hit.filter(x=>norm(x.parts_no).includes(norm(raw)));else hit=hit.filter(x=>norm([x.name,x.original_names].join(' ')).includes(norm(raw)));$('stats').innerHTML='<div class="stat"><b>'+hit.length+'</b> 筆符合資料</div>';if(!hit.length){$('app').innerHTML='<div class="empty">找不到符合資料。<br>可以從「問題回報」告訴管理員要補什麼。</div>';window.ricohTrack?.('no_result_search',raw);return}$('app').innerHTML='<div class="grid">'+hit.map(x=>'<article class="card"><div class="partno">'+esc(x.parts_no)+'</div><div class="name">'+esc(x.name||'未設定名稱')+'</div><div class="models">適用機型：'+esc(type==='model'?modelText(x.models,raw):(x.models||'未設定'))+'</div><div class="links"><a class="link" href="search.html?q='+encodeURIComponent(x.parts_no)+'">查相關工程資料 →</a></div></article>').join('')+'</div>'}function schedule(){clearTimeout(timer);timer=setTimeout(search,180)}$('q').addEventListener('input',schedule);$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(timer);search()}});$('clear').onclick=()=>{$('q').value='';lastToken++;$('stats').innerHTML='';$('app').innerHTML='<div class="empty">請輸入機型、料號或零件名稱。</div>'};const qp=new URLSearchParams(location.search).get('q');if(qp){$('q').value=qp;search()}</script><script src="analytics.js"></script></body></html>
