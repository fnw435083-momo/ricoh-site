<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>零件資料庫｜RICOH Smart Service Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#0878e8;--navy:#08295d;--ink:#173456;--sub:#60758f;--line:#dbe8f5;--soft:#f4f9fe;--red:#d92d20}*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans TC',Arial,sans-serif;color:var(--ink);background:#f5f9fd}a{text-decoration:none;color:inherit}.nav{height:64px;background:linear-gradient(100deg,#061d46,#0a4f9e 58%,#087bdc);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,5%);box-shadow:0 4px 20px #06295d33}.brand{font-weight:900;font-size:20px}.brand span{font-size:11px;font-weight:500;margin-left:10px;color:#dff6ff}.back{font-size:12px;font-weight:700;color:#eaf7ff}.wrap{max-width:1180px;margin:0 auto;padding:42px 22px 70px}.head{margin-bottom:24px}.kicker{font-size:10px;font-weight:900;letter-spacing:.15em;color:var(--blue);text-transform:uppercase}.title{font-size:34px;font-weight:900;color:#0b2d59;margin:6px 0}.desc{font-size:13px;color:var(--sub)}.searchbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 8px 28px #0b5ca00b;position:sticky;top:12px;z-index:10}.searchrow{display:flex;gap:10px}.search{flex:1;border:1px solid #c9d9e8;border-radius:9px;padding:13px 14px;font-size:14px;outline:none}.search:focus{border-color:#55b9ff;box-shadow:0 0 0 3px #55b9ff22}.clear{border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 18px;font-weight:800;color:#41627f;cursor:pointer}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.chip{border:1px solid #d6e5f1;background:#f7fbff;border-radius:99px;padding:5px 10px;font-size:11px;color:#48647f;cursor:pointer}.chip:hover{border-color:#79c8f5;color:#0874d8}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:11px;color:var(--sub)}.stat b{color:#12375e;font-size:15px;margin-right:4px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px #0b5ca016;border-color:#b7d9f1}.partno{font-family:Consolas,monospace;color:#0874d8;font-weight:900;font-size:15px}.name{font-size:17px;font-weight:900;color:#14385f;margin:6px 0 13px}.label{font-size:10px;font-weight:900;color:#7890a7;letter-spacing:.08em;margin-top:9px}.models{font-size:12px;line-height:1.8;color:#46617c;margin-top:3px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{font-size:10px;padding:4px 7px;border-radius:5px;background:#edf7ff;color:#1670bd}.tag.warn{background:#fff5e8;color:#b76a00}.original{font-size:10px;color:#8295a8;line-height:1.6;margin-top:10px;border-top:1px solid #edf2f6;padding-top:9px}.empty{text-align:center;background:#fff;border:1px dashed #c9d9e8;border-radius:13px;padding:50px 20px;color:#72879d}.loading{text-align:center;padding:40px;color:#65809c}.error{background:#fff3f3;border:1px solid #f2c4c4;color:#a32626;border-radius:10px;padding:15px;font-size:12px}.footer{text-align:center;color:#8aa0b6;font-size:10px;margin-top:40px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.title{font-size:28px}.searchrow{flex-direction:column}.clear{height:42px}.nav{padding:0 18px}.brand span{display:none}}
</style>
</head><body>
<header class="nav"><a class="brand" href="index.html">RICOH <span>Smart Service Hub｜工程師工作中心</span></a><a class="back" href="index.html">← 回工程師中心</a></header>
<main class="wrap"><div class="head"><div class="kicker">Parts Database</div><div class="title">工程零件資料庫</div><div class="desc">依 Parts No.、零件名稱或適用機型快速搜尋。PM 週期目前不納入本頁搜尋與判斷。</div></div>
<section class="searchbox"><div class="searchrow"><input id="q" class="search" placeholder="搜尋：Parts No.／零件名稱／機型，例如 A2933899、轉寫皮帶、MP 6000" autocomplete="off"><button id="clear" class="clear">清除</button></div><div id="chips" class="chips"></div></section>
<div id="stats" class="stats"></div><div id="app"><div class="loading">正在載入零件資料…</div></div><div class="footer">TY0032-Willie 製作｜資料來源：公司提供「出貨剪貼簿20240216.xls」｜原始資料保留，標準名稱僅做保守整理</div>
</main>
<script>
async function loadData(){
  const r=await fetch('parts-data.json?'+Date.now()); if(!r.ok) throw new Error('資料檔載入失敗');
  const b64=(await r.text()).trim();
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  if(!('DecompressionStream' in window)) throw new Error('目前瀏覽器不支援資料解壓縮，請改用最新版 Chrome / Edge');
  const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  const text=await new Response(stream).text();
  return JSON.parse(text);
}
let DATA=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function render(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 const hit=DATA.filter(x=>!q || [x[0],x[1],x[3],x[4],x[6]].join(' ').toLowerCase().includes(q));
 document.getElementById('stats').innerHTML=`<div class="stat"><b>${DATA.length}</b> 個料號</div><div class="stat"><b>${hit.length}</b> 筆符合</div>`;
 if(!hit.length){document.getElementById('app').innerHTML='<div class="empty">找不到符合的零件。<br>可以改用 Parts No.、中文名稱、英文名稱或機型搜尋。</div>';return}
 document.getElementById('app').innerHTML='<div class="grid">'+hit.map(x=>{
  const [no,name,status,orig,models,qty,source]=x;
  const tag=status==='待確認'?'warn':(status==='PCU顏色版本'?'warn':'');
  return `<article class="card"><div class="partno">${esc(no)}</div><div class="name">${esc(name||'未設定標準名稱')}</div><div class="label">適用機型</div><div class="models">${esc(models||'未提供機型資料')}</div><div class="meta">${qty?`<span class="tag">更換數量：${esc(qty)}</span>`:''}<span class="tag ${tag}">${esc(status)}</span></div>${orig&&orig!==name?`<div class="original">原始名稱：${esc(orig)}</div>`:''}</article>`
 }).join('')+'</div>';
}
(async()=>{try{const p=await loadData();DATA=p.master;const models=[...new Set(DATA.flatMap(x=>String(x[4]||'').split('；').filter(Boolean)))] .sort((a,b)=>a.localeCompare(b,'zh-Hant')).slice(0,14);document.getElementById('chips').innerHTML=models.map(m=>`<button class="chip" data-v="${esc(m)}">${esc(m)}</button>`).join('');document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.getElementById('q').value=c.dataset.v;render()});render()}catch(e){document.getElementById('app').innerHTML='<div class="error">零件資料載入失敗：'+esc(e.message)+'</div>'}})();
document.getElementById('q').addEventListener('input',render);document.getElementById('clear').onclick=()=>{document.getElementById('q').value='';render()};
</script></body></html>
