<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>零件資料庫｜RICOH Smart Service Hub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--blue:#0878e8;--navy:#08295d;--ink:#173456;--sub:#60758f;--line:#dbe8f5}*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans TC',Arial,sans-serif;color:var(--ink);background:#f5f9fd}.nav{height:64px;background:linear-gradient(100deg,#061d46,#0a4f9e 58%,#087bdc);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5%}.brand{font-weight:900;font-size:20px}.back{font-size:12px;font-weight:700}.wrap{max-width:1180px;margin:auto;padding:42px 22px 70px}.kicker{font-size:10px;font-weight:900;letter-spacing:.15em;color:var(--blue)}.title{font-size:34px;font-weight:900;color:#0b2d59;margin:6px 0}.desc{font-size:13px;color:var(--sub);margin-bottom:24px}.searchbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 8px 28px #0b5ca00b}.searchrow{display:flex;gap:10px}.search{flex:1;border:1px solid #c9d9e8;border-radius:9px;padding:13px 14px;font-size:14px;outline:none}.clear{border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 18px;font-weight:800;color:#41627f}.stats{display:flex;gap:8px;margin:20px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:11px;color:var(--sub)}.stat b{color:#12375e;font-size:15px;margin-right:4px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px}.partno{font-family:Consolas,monospace;color:#0874d8;font-weight:900;font-size:15px}.name{font-size:17px;font-weight:900;color:#14385f;margin:6px 0 13px}.label{font-size:10px;font-weight:900;color:#7890a7;margin-top:9px}.models{font-size:12px;line-height:1.8;color:#46617c;margin-top:3px}.original{font-size:10px;color:#8295a8;line-height:1.6;margin-top:10px;border-top:1px solid #edf2f6;padding-top:9px}.empty,.loading{background:#fff;border-radius:13px;padding:45px 20px;text-align:center;color:#72879d}.error{background:#fff3f3;border:1px solid #f2c4c4;color:#a32626;border-radius:10px;padding:15px;font-size:12px}.footer{text-align:center;color:#8aa0b6;font-size:10px;margin-top:40px}@media(max-width:760px){.grid{grid-template-columns:1fr}.title{font-size:28px}.searchrow{flex-direction:column}.clear{height:42px}.nav{padding:0 18px}}</style></head><body><header class="nav"><a class="brand" href="index.html">RICOH</a><a class="back" href="index.html">← 回工程師中心</a></header><main class="wrap"><div class="kicker">PARTS DATABASE</div><div class="title">工程零件資料庫</div><div class="desc">依 Parts No.、零件名稱快速搜尋。PM 週期目前不納入本頁搜尋與判斷。</div><section class="searchbox"><div class="searchrow"><input id="q" class="search" placeholder="搜尋：Parts No.／零件名稱，例如 A2933899、轉寫皮帶" autocomplete="off"><button id="clear" class="clear">清除</button></div></section><div id="stats" class="stats"></div><div id="app"><div class="loading">正在載入零件資料…</div></div><div class="footer">TY0032-Willie 製作｜資料來源：公司提供「出貨剪貼簿20240216.xls」｜原始資料保留，標準名稱僅做保守整理</div></main><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script><script>let DATA=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function loadData(){const r=await fetch('parts-data.json?v=20260910',{cache:'no-store'});if(!r.ok)throw new Error('資料檔 HTTP '+r.status);const b64=(await r.text()).trim();if(!/^[A-Za-z0-9+/=]+$/.test(b64))throw new Error('資料檔格式錯誤');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const text=pako.ungzip(bin,{to:'string'});const data=JSON.parse(text);return Array.isArray(data)?data:(data.master||[])}function render(){const q=document.getElementById('q').value.trim().toLowerCase();const hit=DATA.filter(x=>!q||String(x[0]||'').toLowerCase().includes(q)||String(x[1]||'').toLowerCase().includes(q));document.getElementById('stats').innerHTML='<div class="stat"><b>'+DATA.length+'</b> 個料號</div><div class="stat"><b>'+hit.length+'</b> 筆符合</div>';if(!hit.length){document.getElementById('app').innerHTML='<div class="empty">找不到符合的零件。<br>請改用 Parts No. 或零件名稱搜尋。</div>';return}document.getElementById('app').innerHTML='<div class="grid">'+hit.map(x=>'<article class="card"><div class="partno">'+esc(x[0])+'</div><div class="name">'+esc(x[1]||'未設定名稱')+'</div></article>').join('')+'</div>'} (async()=>{try{DATA=await loadData();render()}catch(e){document.getElementById('app').innerHTML='<div class="error">零件資料載入失敗：'+esc(e.message)+'<br>這次已改成簡化資料格式，請重新整理頁面再試。</div>'}})();document.getElementById('q').addEventListener('input',render);document.getElementById('clear').onclick=()=>{document.getElementById('q').value='';render()};</script></body></html>
